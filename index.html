<title>Lernheft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: eine Spalte, Tab-Leiste unten. Vokabeln als Karteikasten mit 5 Fächern, Mathe auf Karopapier. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#566180; --line:#D8DFEC;
  --accent:#0D6B8A; --accent-ink:#FFFFFF; --mark:#FFD84A; --mark-ink:#16203A; --tipbg:#FFF3BF;
  --good:#1B7F52; --good-bg:#E3F4EB; --bad:#B93A2A; --bad-bg:#FBE9E5; --grid:#DCE6F4;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1526; --surface:#18213A; --ink:#E9EEF9; --muted:#9DA9C8; --line:#2A3655;
    --accent:#55C7E4; --accent-ink:#08202A; --mark:#E9C13B; --mark-ink:#16203A; --tipbg:#3A3416;
    --good:#5FD39A; --good-bg:#123327; --bad:#FF8C7A; --bad-bg:#3A1D1A; --grid:#243251;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1526; --surface:#18213A; --ink:#E9EEF9; --muted:#9DA9C8; --line:#2A3655;
  --accent:#55C7E4; --accent-ink:#08202A; --mark:#E9C13B; --mark-ink:#16203A; --tipbg:#3A3416;
  --good:#5FD39A; --good-bg:#123327; --bad:#FF8C7A; --bad-bg:#3A1D1A; --grid:#243251;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
.app{max-width:640px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.01em;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 4px;margin-left:-4px;color:var(--ink)}
.pts{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted)}
.pts b{color:var(--ink);font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.btn.ghost.danger{background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.link{font:inherit;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 0;min-height:44px}
.input,.select,.area{font:inherit;font-size:19px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.area{font-size:16px;min-height:200px;line-height:1.5;resize:vertical}
.input:focus,.select:focus,.area:focus{border-color:var(--accent);outline:none}
label.lab{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{min-width:44px;min-height:44px;font:inherit;font-size:19px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0 8px}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:700;font-size:15px;min-height:46px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;padding:6px 4px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.15}
.tile .s{font-size:14px;color:var(--muted)}
.tile.mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.tile.mark .s{color:var(--mark-ink)}
.pips{display:flex;gap:5px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.ring{display:block}
.r-bg{fill:none;stroke:var(--line);stroke-width:9}
.r-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.ring text{font-family:var(--font-display);font-weight:800;font-size:24px;fill:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end}
.bx{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drawer{width:100%;height:44px;border:2px solid var(--ink);border-radius:3px 3px 7px 7px;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden}
.drawer i{display:block;width:100%;height:var(--h);background:var(--mark)}
.bx b{color:var(--ink);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.paper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.q{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.5}
.q span{background:var(--surface);box-shadow:0 0 0 5px var(--surface);border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.big{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.2;overflow-wrap:anywhere}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.tip{background:var(--tipbg);border-radius:10px;padding:10px 12px;font-size:16px}
.tip b{font-family:var(--font-display)}
.ansrow{display:flex;gap:8px;align-items:center}
.ansrow .pre,.ansrow .unit{font-weight:700;font-size:20px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:12px}
.setcard{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.words{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface)}
.words div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.words div:last-child{border-bottom:0}
.words span{min-width:0;overflow-wrap:anywhere}
.say{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.say svg{width:24px;height:24px;fill:currentColor}
.say:active{background:var(--accent);color:var(--accent-ink)}
.ipa{font-size:19px;color:var(--muted);letter-spacing:.02em}
.wd{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.tr{font-size:20px;font-weight:700}
.exq{border-left:4px solid var(--mark);padding:2px 0 2px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.exq p{font-size:18px;min-width:0}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--ink);margin:0 .15em;vertical-align:baseline}
.exq b{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.nt{background:var(--tipbg);border-radius:10px;padding:10px 12px;font-size:16px}
.mn{background:var(--tipbg);border-radius:10px;padding:10px 12px;font-size:16px}
.mn p{margin:2px 0 0}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:600;font-size:18px;text-align:left;min-height:54px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--accent)}
.bdg{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bdg.off{opacity:.5}
.bdot{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink);background:var(--accent)}
.bdg.off .bdot{background:transparent;border-color:var(--line)}
.wk{display:flex;gap:8px;align-items:flex-end}
.wkc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.wkc b{color:var(--ink)}
.wkb{width:100%;height:70px;background:var(--bg);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--line)}
.wkc.hit .wkb i{background:var(--good)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav[hidden]{display:none!important}
.nav .in{display:flex;gap:6px;width:100%;max-width:640px}
.nav button{flex:1;font:inherit;font-weight:700;font-size:15px;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{background:var(--mark);color:var(--mark-ink)}
.err{color:var(--bad);font-weight:700;font-size:15px}
.tilebox{display:flex;flex-direction:column;gap:0;min-width:0}
.tilebox .tile{flex:1}
.tilebox .link{text-align:left;font-size:15px;min-height:40px;padding:6px 4px}
.rule{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rule h3{font-size:17px;margin-bottom:4px}
.merke{background:var(--tipbg);border-radius:12px;padding:12px 14px;font-weight:600}
.exs{display:flex;flex-direction:column;gap:8px}
.exs .st{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.exs .st b{color:var(--accent)}
details.tips summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.chks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.exc{border:2px solid var(--accent)}
.exc.urgent{background:var(--tipbg)}
.exrow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.big{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>

<body>
<div id="app" class="app"></div>
<nav id="nav" class="nav"></nav>

<script>
// ==LOGIC-START==
const MINUS='−';
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
const round2=n=>Math.round(n*100)/100;
const fmt=n=>String(round2(n)).replace('.',',').replace('-',MINUS);
const br=n=>n<0?'('+fmt(n)+')':fmt(n);
const tm=n=>n<0?MINUS+' '+fmt(-n):'+ '+fmt(n);
const eur=n=>round2(n).toFixed(2).replace('.',',')+' €';
const sign=()=>Math.random()<.5?-1:1;

function linStr(terms){
  return terms.map(function(t,i){
    const c=t[0],isx=t[1],abs=Math.abs(c);
    const body=isx?(abs===1?'x':fmt(abs)+'x'):fmt(abs);
    if(i===0)return (c<0?MINUS:'')+body;
    return (c<0?' '+MINUS+' ':' + ')+body;
  }).join('');
}

/* ---------- Mathe-Aufgaben ---------- */
function genNeg(l){
  if(l===1){
    const a=ri(-12,12)||5,b=ri(1,12)*sign(),plus=Math.random()<.5;
    const ans=plus?a+b:a-b;
    const q='Berechne: '+fmt(a)+' '+(plus?'+':MINUS)+' '+br(b);
    let t1,t2;
    if(plus){
      const same=(a<0)===(b<0),A=Math.abs(a),B=Math.abs(b);
      t1='Gleiche Vorzeichen: Beträge addieren und das Vorzeichen behalten. Verschiedene Vorzeichen: den kleineren Betrag vom größeren abziehen.';
      t2='Die Beträge sind '+A+' und '+B+'. '+(same?'Gleiche Vorzeichen: rechne '+A+' + '+B+' und setze '+(a<0?'ein Minus':'ein Plus')+' davor.':'Verschiedene Vorzeichen: rechne '+Math.max(A,B)+' '+MINUS+' '+Math.min(A,B)+'. Das Vorzeichen hat die Zahl mit dem größeren Betrag.');
    }else{
      t1='Minus eine Zahl ist dasselbe wie plus die Gegenzahl.';
      t2=fmt(a)+' '+MINUS+' '+br(b)+' wird zu '+fmt(a)+' + '+br(-b)+'. Rechne jetzt wie bei einer Addition.';
    }
    return {q:q,unit:'',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)};
  }
  if(l===2){
    const mult=Math.random()<.5,b=ri(2,9)*sign();
    let a,ans,q,op;
    if(mult){a=ri(2,9)*sign();ans=a*b;op='·';q='Berechne: '+br(a)+' · '+br(b);}
    else{ans=ri(2,9)*sign();a=b*ans;op=':';q='Berechne: '+br(a)+' : '+br(b);}
    const same=(a<0)===(b<0);
    const t1='Gleiche Vorzeichen ergeben Plus, verschiedene Vorzeichen ergeben Minus.';
    const t2='Ohne Vorzeichen: '+Math.abs(a)+' '+op+' '+Math.abs(b)+' = '+Math.abs(ans)+'. '+(same?'Gleiche Vorzeichen, also Plus.':'Verschiedene Vorzeichen, also Minus.');
    return {q:q,unit:'',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)};
  }
  const a=ri(-6,6)||3,b=ri(-6,6)||2,c=ri(-15,15)||4;
  const ans=a*b+c;
  const t1='Punkt vor Strich: Rechne zuerst die Malaufgabe.';
  const t2=br(a)+' · '+br(b)+' = '+fmt(a*b)+'. Danach bleibt '+fmt(a*b)+' + '+br(c)+'.';
  return {q:'Berechne: '+br(a)+' · '+br(b)+' + '+br(c),unit:'',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)};
}

function genProz(l){
  const ps=[5,10,15,20,25,30,40,50,60,75,80];
  if(l===1){
    const G=pick([20,40,60,80,100,120,160,200,240,300,400,500]),p=pick([5,10,20,25,50,75]);
    const W=G*p/100;
    const t1='Teile den Grundwert durch 100, das sind 1 %. Dann nimm das mal den Prozentsatz.';
    const t2=G+' : 100 = '+fmt(G/100)+'. Das ist 1 %. Jetzt mal '+p+'.';
    return {q:'Berechne '+p+' % von '+G+'.',unit:'',pre:'',kind:'num',ans:W,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(W)};
  }
  if(l===2){
    const t=pick(['wert','satz','grund']);
    if(t==='wert'){
      const G=pick([40,60,80,120,160,200,240,300]),p=pick([10,15,20,25,30,40]),W=G*p/100;
      const t1='Teile den Preis durch 100, das sind 1 %. Dann mal den Prozentsatz.';
      const t2=G+' : 100 = '+fmt(G/100)+'. Das mal '+p+' ergibt den Rabatt.';
      return {q:'Ein Fahrrad kostet '+G+' €. Du bekommst '+p+' % Rabatt. Wie viel Euro sparst du?',unit:'€',pre:'',kind:'num',ans:W,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(W)+' €'};
    }
    if(t==='satz'){
      let G,p,W;do{G=pick([20,40,50,100,200]);p=pick(ps.concat([35,45,55,65]));W=G*p/100;}while(W%1!==0);
      const t1='Rechne aus, wie viel 1 % ist. Dann prüfe, wie oft das in den Teil passt.';
      const t2='1 % von '+G+' sind '+fmt(G/100)+'. Wie oft passt '+fmt(G/100)+' in '+fmt(W)+'?';
      return {q:'Von '+G+' Kindern bringen '+W+' ein Haustier mit. Wie viel Prozent sind das?',unit:'%',pre:'',kind:'num',ans:p,tips:[t1,t2],sol:t2+' Ergebnis: '+p+' %'};
    }
    const G=pick([100,200,300,400,500,800,1000]),p=pick([5,10,20,25,40,50]),W=G*p/100;
    const t1='Rechne zuerst aus, wie viel 1 % ist: Teil durch Prozentsatz.';
    const t2=W+' : '+p+' = '+fmt(W/p)+' sind 1 %. Das mal 100 ergibt das Ganze.';
    return {q:W+' Schülerinnen und Schüler sind '+p+' % aller Kinder einer Schule. Wie viele Kinder hat die Schule?',unit:'',pre:'',kind:'num',ans:G,tips:[t1,t2],sol:t2+' Ergebnis: '+G};
  }
  const t=pick(['minus','plus','mwst']);
  if(t==='mwst'){
    const G=pick([100,200,300,400,500]),W=G*19/100;
    const t1='Rechne zuerst die Steuer aus (19 % vom Preis), dann addiere sie.';
    const t2='19 % von '+G+' sind '+fmt(W)+'. Das kommt zum Preis dazu.';
    return {q:'Ein Laptop kostet ohne Mehrwertsteuer '+G+' €. Dazu kommen 19 % Mehrwertsteuer. Wie viel kostet er mit Steuer?',unit:'€',pre:'',kind:'num',ans:G+W,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(G+W)+' €'};
  }
  const G=pick([40,60,80,120,160,200]),p=pick([10,15,20,25,30,40]),W=G*p/100;
  const minus=t==='minus';
  const q=minus?('Eine Jacke kostet '+G+' €. Im Sale sinkt der Preis um '+p+' %. Wie viel kostet sie jetzt?'):('Ein Spiel kostet '+G+' €. Der Preis steigt um '+p+' %. Wie viel kostet es danach?');
  const t1=minus?'Rechne zuerst den Rabatt in Euro aus, dann ziehe ihn vom Preis ab.':'Rechne zuerst die Erhöhung in Euro aus, dann addiere sie zum Preis.';
  const t2=p+' % von '+G+' sind '+fmt(W)+' €. '+(minus?'Ziehe das von '+G+' ab.':'Addiere das zu '+G+'.');
  const ans=minus?G-W:G+W;
  return {q:q,unit:'€',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)+' €'};
}

/* ---------- Antworten prüfen: Mathe ---------- */
function parseNum(s){
  s=String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');
  s=s.replace(',','.').replace(/^[a-z]=/,'').replace(/[a-z€°%]+$/g,'');
  if(!/^-?\d+(\.\d+)?$/.test(s))return null;
  return parseFloat(s);
}
function checkNum(user,ans){
  const v=parseNum(user);
  if(v===null)return 'format';
  return Math.abs(v-ans)<0.005?'ok':'wrong';
}
function parseLin(s){
  s=String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[*·]/g,'').replace(/,/g,'.').replace(/^[a-z]=/,'');
  if(!s||!/^[+-]?(\d*\.?\d*x|\d+\.?\d*)([+-](\d*\.?\d*x|\d+\.?\d*))*$/.test(s))return null;
  const toks=s.match(/[+-]?(\d*\.?\d*x|\d+\.?\d*)/g)||[];
  let a=0,b=0,nx=0,nn=0;
  toks.forEach(function(t){
    if(t.slice(-1)==='x'){
      const c=t.slice(0,-1);
      a+=(c===''||c==='+')?1:(c==='-'?-1:parseFloat(c));nx++;
    }else{b+=parseFloat(t);nn++;}
  });
  if(isNaN(a)||isNaN(b))return null;
  return {a:a,b:b,nx:nx,nn:nn};
}
function checkLin(user,ans){
  const p=parseLin(user);
  if(!p)return 'format';
  if(p.nx>1||p.nn>1)return 'notsimple';
  return Math.abs(p.a-ans.a)<1e-9&&Math.abs(p.b-ans.b)<1e-9?'ok':'wrong';
}

/* ---------- Antworten prüfen: Vokabeln ---------- */
const unAccent=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae');
const normV=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\(.*?\)/g,' ').replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
function altsOf(raw){return String(raw).split(/[\/;]/).map(normV).filter(Boolean);}
const LEADDE=/^(der|die|das|ein|eine|sich|etwas|jn|jm|jemanden|jemandem) /;
function formsOf(alt,side){
  const f=[alt];
  if(side==='en'&&alt.indexOf('to ')===0)f.push(alt.slice(3));
  if(side==='en'){
    const m=alt.replace(/^(the|a|an) /,'');
    if(m!==alt)f.push(m);
  }
  if(side==='de'){
    const m=alt.replace(LEADDE,'');
    if(m!==alt)f.push(m);
  }
  return f;
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  let prev=[];for(let j=0;j<=n;j++)prev.push(j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur.push(Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)));
    }
    prev=cur;
  }
  return prev[n];
}
function checkVocab(user,answerRaw,side){
  const u0=normV(user);
  if(!u0)return {r:'empty'};
  const cands=side==='de'?[u0,u0.replace(LEADDE,'')]:[u0];
  let best={r:'wrong'};
  for(let i=0;i<cands.length;i++){
    if(!cands[i])continue;
    const r=checkOne(cands[i],answerRaw,side);
    if(r.r==='ok')return r;
    if(r.r==='almost'&&best.r==='wrong')best=r;
  }
  return best;
}
function checkOne(u,answerRaw,side){
  const alts=altsOf(answerRaw);
  for(let i=0;i<alts.length;i++){if(formsOf(alts[i],side).indexOf(u)>=0)return {r:'ok'};}
  for(let i=0;i<alts.length;i++){
    const fs=formsOf(alts[i],side);
    for(let k=0;k<fs.length;k++){
      const f=fs[k];
      if(unAccent(u)===unAccent(f))return {r:'almost',msg:'Fast richtig. Schau noch mal auf Akzente und Sonderzeichen.'};
      if(side==='fr'){
        const m=f.replace(/^(le |la |les |l'|un |une )/,'');
        if(m!==f&&u===m)return {r:'almost',msg:'Fast richtig. Denk an den Artikel.'};
      }
      if(f.length>=5&&lev(u,f)<=1)return {r:'almost',msg:'Fast richtig. Ein Buchstabe stimmt noch nicht.'};
    }
  }
  return {r:'wrong'};
}
function parseLines(text){
  const cards=[];let skipped=0;
  String(text).split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    const parts=line.split('|');line=parts[0];
    const mm=/=|\t|\s[\u2013\u2014-]\s/.exec(line);
    if(!mm){skipped++;return;}
    const fx=line.slice(0,mm.index).trim(),de=line.slice(mm.index+mm[0].length).trim();
    if(!fx||!de){skipped++;return;}
    const card={fx:fx,de:de};
    const clean=function(x){return String(x||'').trim().replace(/^[\[\/]+|[\]\/]+$/g,'').trim();};
    if(clean(parts[1]))card.ipa=clean(parts[1]);
    if(parts[2]&&parts[2].trim())card.ex=parts[2].trim();
    if(parts[3]&&parts[3].trim())card.nt=parts[3].trim();
    cards.push(card);
  });
  return {cards:cards,skipped:skipped};
}
function daysUntil(ds,now){
  const p=String(ds).split('-').map(Number);
  const t=new Date(p[0],p[1]-1,p[2]).getTime();
  const n=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  return Math.round((t-n)/86400000);
}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function dateLong(ds){const p=String(ds).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);return WD[d.getDay()]+', '+p[2]+'.'+p[1]+'.'+p[0];}
function quotaToday(startRemaining,daysLeft){
  if(daysLeft<0)return {phase:'over',quota:0};
  if(daysLeft===0)return {phase:'today',quota:0};
  const phase=daysLeft<=2?'repeat':'build';
  if(startRemaining<=0)return {phase:phase,quota:phase==='repeat'?8:0};
  const q=Math.ceil(startRemaining/Math.max(1,daysLeft-1));
  return {phase:phase,quota:Math.max(5,Math.min(30,q))};
}

const GRAM=[{"id":"e-c2a","lang":"en","unit":"Unit 2","name":"Conditional 2: Bildung","sub":"If I had …, I would …","short":"if-Satz: simple past. Hauptsatz: would + Infinitiv.","intro":"Mit dem **Conditional 2** sprichst du über Dinge, die du dir nur vorstellst oder die eher unwahrscheinlich sind: Was würde passieren, wenn …?","rules":[{"h":"So wird er gebildet","p":"**if-Satz:** simple past (If I **had** a kayak, …). **Hauptsatz:** would + Infinitiv ohne to (… I **would paddle** across the lake.)."},{"h":"Keine Vergangenheit","p":"Obwohl im if-Satz das simple past steht, geht es nicht um früher. Es ist die Form für Gedankenspiele. Im Deutschen entspricht das dem Konjunktiv: „Wenn ich ein Kajak hätte, würde ich …“."},{"h":"Die Reihenfolge","p":"Du kannst beide Teile tauschen. Steht der **if-Satz vorn**, kommt ein **Komma**. Steht er hinten, gibt es **kein Komma**: I would paddle across the lake if I had a kayak."},{"h":"Would nur im Hauptsatz","p":"**would** steht nie im if-Satz. Falsch ist: If I would have a kayak, … Richtig: If I **had** a kayak, …"},{"h":"Unregelmäßige Verben","p":"Im if-Satz brauchst du die Form des simple past: have – had, go – went, see – saw, know – knew, take – took, get – got, give – gave, come – came, do – did, win – won. Nach would bleibt das Verb in der Grundform."},{"h":"could und might im Hauptsatz","p":"Statt would kann im Hauptsatz auch **could** (könnte) oder **might** (würde vielleicht) + Infinitiv stehen: If I were in London, I **could** visit my uncle. / I **might** visit my uncle."}],"examples":["If I had a kayak, I would paddle across the lake.","If we lived in Wales, we would speak Welsh.","We would arrive earlier if the bus drove faster."],"items":[{"t":"g","q":"If I ___ (have) a kayak, I would paddle across the lake.","a":["had"],"w":"if-Satz: simple past. have – had."},{"t":"g","q":"If we ___ (live) in Wales, we would speak Welsh.","a":["lived"],"w":"Regelmäßig: live – lived."},{"t":"g","q":"If she ___ (know) the answer, she would tell us.","a":["knew"],"w":"know – knew (unregelmäßig)."},{"t":"g","q":"If I ___ (win) a lot of money, I would buy a big house.","a":["won"],"w":"win – won (unregelmäßig)."},{"t":"g","q":"We would arrive earlier if the bus ___ (drive) faster.","a":["drove"],"w":"Auch wenn der if-Satz hinten steht, braucht er das simple past: drive – drove."},{"t":"g","q":"If Tom ___ (get) more pocket money, he would save it.","a":["got"],"w":"get – got."},{"t":"g","q":"If I had a kayak, I ___ (paddle) across the lake.","a":["would paddle","'d paddle"],"w":"Hauptsatz: would + Infinitiv, ohne to."},{"t":"g","q":"If they ___ (come) earlier, they would see the whole show.","a":["came"],"w":"come – came."},{"t":"g","q":"If we had a football, we ___ (have) more fun at breaks.","a":["would have"],"w":"Hauptsatz: would + Infinitiv. Hier: would have."},{"t":"g","q":"If I ___ (go) to bed earlier, I would not feel so tired.","a":["went"],"w":"go – went."},{"t":"g","q":"If you ___ (see) a ghost, what would you do?","a":["saw"],"w":"see – saw."},{"t":"g","q":"If my friends ___ (visit) me more often, I would be happy.","a":["visited"],"w":"Regelmäßig: visit – visited."},{"t":"g","q":"If we lived in Newcastle, we ___ (visit) the museum every weekend.","a":["would visit","'d visit"],"w":"Hauptsatz: would + Infinitiv."},{"t":"g","q":"If Dad ___ (give) me a laptop, I would write a blog.","a":["gave"],"w":"give – gave."},{"t":"g","q":"The teacher would be happy if we ___ (do) our homework.","a":["did"],"w":"do – did."},{"t":"g","q":"If I ___ (take) a photo of the lake, I would send it to you.","a":["took"],"w":"take – took."},{"t":"m","q":"Welcher Satz ist richtig?","o":["If I had a kayak, I would paddle across the lake.","If I would have a kayak, I would paddle across the lake.","If I have a kayak, I would paddle across the lake."],"c":"If I had a kayak, I would paddle across the lake.","w":"would steht nur im Hauptsatz. Im if-Satz steht das simple past."},{"t":"m","q":"If we ___ in Wales, we would speak Welsh.","o":["lived","live","would live","will live"],"c":"lived","w":"Im if-Satz steht das simple past."},{"t":"m","q":"I ___ more fun at breaks if I had a football.","o":["would have","had","will have","have"],"c":"would have","w":"Im Hauptsatz brauchst du would + Infinitiv."},{"t":"m","q":"Welcher Satz ist richtig?","o":["If the bus drove faster, we would arrive earlier.","If the bus would drive faster, we would arrive earlier.","If the bus drives faster, we would arrive earlier."],"c":"If the bus drove faster, we would arrive earlier.","w":"if + simple past, would + Infinitiv."},{"t":"t","q":"Wenn ich ein Kajak hätte, würde ich über den See paddeln.","a":["If I had a kayak, I would paddle across the lake.","I would paddle across the lake if I had a kayak.","If I had a kayak, I would paddle over the lake.","I would paddle over the lake if I had a kayak."],"w":"if + simple past, would + Infinitiv. Mit if-Satz vorn kommt ein Komma."},{"t":"t","q":"Wenn wir in Wales wohnten, würden wir Walisisch sprechen.","a":["If we lived in Wales, we would speak Welsh.","We would speak Welsh if we lived in Wales."],"w":"if + simple past, would + Infinitiv."},{"t":"t","q":"Wenn ich mehr Zeit hätte, würde ich mehr lesen.","a":["If I had more time, I would read more.","I would read more if I had more time."],"w":"have – had im if-Satz, would read im Hauptsatz."},{"t":"t","q":"Wenn wir einen Fußball hätten, hätten wir mehr Spaß in den Pausen.","a":["If we had a football, we would have more fun at breaks.","We would have more fun at breaks if we had a football."],"w":"Zweimal have: im if-Satz had, im Hauptsatz would have."},{"t":"g","q":"If Lena ___ (not/have) a match tomorrow, she would come to the party.","a":["didn't have","did not have"],"w":"Verneinter if-Satz: didn’t + Infinitiv."},{"t":"g","q":"Max would be healthier if he ___ (eat) more vegetables.","a":["ate"],"w":"eat – ate (unregelmäßig)."},{"t":"g","q":"If Sam ___ (have) enough money, he would buy the new boots.","a":["had"],"w":"have – had."},{"t":"g","q":"Ella ___ (go) skating if it were not so warm.","a":["would go","'d go"],"w":"Hauptsatz: would + Infinitiv."},{"t":"g","q":"If my cousins ___ (not/live) in Spain, I would see them more often.","a":["didn't live","did not live"],"w":"Verneinter if-Satz: didn’t + Infinitiv."},{"t":"m","q":"Sarah could be a great actor if she ___ so shy.","o":["weren’t","didn’t be","wouldn’t be","isn’t"],"c":"weren’t","w":"Verneinung von be im if-Satz: weren’t."}]},{"id":"e-c2b","lang":"en","unit":"Unit 2","name":"Conditional 2: were, could, Verneinung","sub":"If I were you … · wouldn’t · could","short":"be → were (was auch möglich). Hauptsatz: would, could oder might + Infinitiv. Verneint: didn’t / wouldn’t.","intro":"Hier kommen die Besonderheiten des Conditional 2: das Verb **be**, **could**, die Verneinung und Fragen.","rules":[{"h":"If I were …","p":"Beim Verb **be** steht im if-Satz oft **were** statt was: If I **were** a cat, … Möglich ist aber auch **was**: If I **was** in London, … Mit **were** liegst du immer richtig."},{"h":"If I were you, …","p":"Mit dieser festen Wendung gibst du Ratschläge: If I **were** you, I **would** ask a teacher for help. (An deiner Stelle würde ich …)"},{"h":"could","p":"**could** heißt „könnte“, **might** heißt „würde vielleicht“. Beide stehen im Hauptsatz statt would: If we had a car, we **could** drive to the sea. If it stopped raining, we **might** go out."},{"h":"Verneinung","p":"Im if-Satz verneinst du mit **didn’t + Infinitiv**: If I **didn’t have** a kayak, … Bei be mit **weren’t**. Im Hauptsatz heißt es **wouldn’t + Infinitiv**."},{"h":"Fragen und Kurzantworten","p":"**Would** du …? – Yes, I **would**. / No, I **wouldn’t**. Mit Fragewort: What **would** you do if you were the head teacher?"}],"examples":["If I were you, I would ask a teacher for help.","If we had a car, we could drive to the sea.","If it didn’t rain, we would play outside."],"items":[{"t":"g","q":"If I ___ (be) rich, I would travel around the world.","a":["were","was"],"w":"be im if-Satz: were."},{"t":"g","q":"If she ___ (be) at home, she could help us.","a":["were","was"],"w":"be im if-Satz: were."},{"t":"g","q":"If I ___ you, I would ask a teacher for help.","a":["were"],"w":"Feste Wendung: If I were you, …"},{"t":"g","q":"If we had a car, we ___ (can) drive to the sea.","a":["could"],"w":"could = könnte. Es steht im Hauptsatz."},{"t":"g","q":"If Emily ran away to London, she ___ (can) see Mo and Luke.","a":["could"],"w":"could = könnte."},{"t":"g","q":"If I ___ (not/have) a kayak, I wouldn’t paddle across the lake.","a":["didn't have","did not have"],"w":"Verneinter if-Satz: didn’t + Infinitiv."},{"t":"g","q":"If it ___ (not/rain), we would play outside.","a":["didn't rain","did not rain"],"w":"Verneinter if-Satz: didn’t + Infinitiv."},{"t":"g","q":"I ___ (not/go) to school by bus if the school were closer.","a":["wouldn't go","would not go"],"w":"Verneinter Hauptsatz: wouldn’t + Infinitiv."},{"t":"g","q":"If Emily ran away, she ___ (not/have) a place to live.","a":["wouldn't have","would not have"],"w":"Verneinter Hauptsatz: wouldn’t + Infinitiv."},{"t":"g","q":"What ___ you do if you were the head teacher?","a":["would"],"w":"Frage im Hauptsatz: would + Subjekt + Infinitiv."},{"t":"g","q":"Would you buy more tablets if you were the head teacher? – Yes, I ___.","a":["would"],"w":"Kurzantwort: Yes, I would."},{"t":"g","q":"Would Emily ask a teacher for help? – No, she ___.","a":["wouldn't","would not"],"w":"Kurzantwort: No, she wouldn’t."},{"t":"g","q":"If students ___ (not/be) so tired, they would learn better.","a":["weren't","were not"],"w":"Verneinung von be im if-Satz: weren’t."},{"t":"g","q":"If I were a police officer, I ___ (catch) lots of thieves.","a":["would catch","'d catch"],"w":"Hauptsatz: would + Infinitiv."},{"t":"g","q":"We ___ (can) have more fun at breaks if we had a football.","a":["could"],"w":"could = könnten."},{"t":"m","q":"If I ___ you, I would ask a teacher.","o":["were","was","am","would be"],"c":"were","w":"Feste Wendung: If I were you, …"},{"t":"m","q":"Welcher Satz ist die Verneinung von „If I had a kayak, I would paddle across the lake“?","o":["If I didn’t have a kayak, I wouldn’t paddle across the lake.","If I don’t had a kayak, I wouldn’t paddle across the lake.","If I didn’t have a kayak, I won’t paddle across the lake."],"c":"If I didn’t have a kayak, I wouldn’t paddle across the lake.","w":"if-Satz: didn’t + Infinitiv. Hauptsatz: wouldn’t + Infinitiv."},{"t":"m","q":"Was bedeutet „we could see Mo and Luke“?","o":["wir könnten Mo und Luke sehen","wir konnten Mo und Luke sehen","wir sahen Mo und Luke","wir werden Mo und Luke sehen"],"c":"wir könnten Mo und Luke sehen","w":"could ist hier der Konjunktiv: könnte."},{"t":"m","q":"Would you help me if I asked? – Yes, …","o":["I would.","I did.","I will.","I help."],"c":"I would.","w":"Kurzantwort mit would."},{"t":"t","q":"Wenn ich du wäre, würde ich einen Lehrer um Hilfe bitten.","a":["If I were you, I would ask a teacher for help.","I would ask a teacher for help if I were you."],"w":"If I were you, …"},{"t":"t","q":"Wenn wir ein Auto hätten, könnten wir zum Meer fahren.","a":["If we had a car, we could drive to the sea.","We could drive to the sea if we had a car."],"w":"could im Hauptsatz."},{"t":"t","q":"Wenn es nicht regnete, würden wir draußen spielen.","a":["If it didn’t rain, we would play outside.","We would play outside if it didn’t rain."],"w":"Verneinter if-Satz: didn’t + Infinitiv."},{"t":"t","q":"Was würdest du tun, wenn du Schulleiter wärst?","a":["What would you do if you were the head teacher?","What would you do if you were the headteacher?"],"w":"Fragewort + would + Subjekt + Infinitiv."},{"t":"t","q":"Wenn ich du wäre, würde ich das nicht tun.","a":["If I were you, I wouldn't do that.","I wouldn't do that if I were you."],"w":"If I were you, … Hauptsatz verneint: wouldn’t + Infinitiv."},{"t":"t","q":"Wenn mein Vater hier wäre, würde er mir dieses Spiel kaufen.","a":["If my dad were here, he would buy me this game.","He would buy me this game if my dad were here.","If my dad was here, he would buy me this game.","He would buy me this game if my dad was here."],"w":"were im if-Satz, would + Infinitiv im Hauptsatz."},{"t":"g","q":"Would you be angry if I lost your camera? – Yes, I ___.","a":["would"],"w":"Kurzantwort: Yes, I would."},{"t":"g","q":"What would you do if you ___ (win) the lottery?","a":["won"],"w":"Auch in der Frage steht im if-Satz das simple past."},{"t":"g","q":"If I were in London, I ___ (might/visit) my uncle.","a":["might visit"],"w":"might + Infinitiv = würde vielleicht."},{"t":"g","q":"If it stopped raining, we ___ (might/go) to the park.","a":["might go"],"w":"might + Infinitiv."},{"t":"m","q":"Wenn wir mehr Zeit hätten, würden wir vielleicht das Museum besuchen. Welcher Satz passt?","o":["If we had more time, we might visit the museum.","If we would have more time, we might visit the museum.","If we had more time, we might visiting the museum."],"c":"If we had more time, we might visit the museum.","w":"if + simple past, might + Infinitiv. would steht nie im if-Satz."},{"t":"t","q":"Wenn ich in London wäre, könnte ich meinen Onkel besuchen.","a":["If I were in London, I could visit my uncle.","I could visit my uncle if I were in London.","If I was in London, I could visit my uncle.","I could visit my uncle if I was in London."],"w":"were (oder was) im if-Satz, could + Infinitiv im Hauptsatz."}]},{"id":"e-c12","lang":"en","unit":"Unit 2","name":"Conditional 1 oder 2?","sub":"will oder would?","short":"Möglich: if + Präsens, will. Ausgedacht: if + simple past, would.","intro":"Beide if-Sätze sehen ähnlich aus. Entscheidend ist, ob etwas **wirklich passieren kann** oder ob du es dir nur **ausdenkst**.","rules":[{"h":"Conditional 1: gut möglich","p":"**if + simple present, will + Infinitiv.** If it **rains** tomorrow, we **will stay** at home. Das kann wirklich passieren."},{"h":"Conditional 2: ausgedacht","p":"**if + simple past, would + Infinitiv.** If I **had** wings, I **would fly** over the school. Das ist ein Gedankenspiel."},{"h":"Faustregel","p":"Frag dich: Kann das stimmen? Dann **will**. Ist es nur eine Vorstellung? Dann **would**. Nach **if** steht nie will oder would."}],"examples":["If it rains tomorrow, we will stay at home.","If I had wings, I would fly over the school."],"items":[{"t":"g","q":"If it ___ (rain) tomorrow, we will stay at home.","a":["rains"],"w":"Typ 1: if + simple present."},{"t":"g","q":"If I ___ (have) a million pounds, I would buy an island.","a":["had"],"w":"Typ 2: if + simple past."},{"t":"g","q":"If you ___ (study), you will pass the test.","a":["study"],"w":"Typ 1: if + simple present."},{"t":"g","q":"If she ___ (be) taller, she would play basketball.","a":["were","was"],"w":"Typ 2: be wird zu were."},{"t":"g","q":"We will go to the beach if the weather ___ (be) nice.","a":["is"],"w":"Typ 1: nach if steht das Präsens, nicht will."},{"t":"g","q":"If I ___ (be) the head teacher, I would stop homework.","a":["were","was"],"w":"Typ 2: be wird zu were."},{"t":"g","q":"If Tom ___ (miss) the bus, he will be late.","a":["misses"],"w":"Typ 1: he/she/it bekommt ein -s."},{"t":"g","q":"If I ___ (find) a wallet, I would take it to the police.","a":["found"],"w":"Typ 2: find – found."},{"t":"g","q":"If you ___ (not/hurry), you will miss the train.","a":["don't hurry","do not hurry"],"w":"Typ 1, verneint: don’t + Infinitiv."},{"t":"g","q":"If we ___ (win) the match tomorrow, we will celebrate.","a":["win"],"w":"Typ 1: if + simple present."},{"t":"m","q":"Es regnet vielleicht morgen. Welcher Satz passt?","o":["If it rains tomorrow, we will stay at home.","If it rained tomorrow, we will stay at home.","If it rains tomorrow, we would stay at home."],"c":"If it rains tomorrow, we will stay at home.","w":"Möglich: if + Präsens, will + Infinitiv."},{"t":"m","q":"If I ___ a queen, I would live in a castle.","o":["were","am","will be","would be"],"c":"were","w":"Ausgedacht: Typ 2. be wird zu were."},{"t":"m","q":"If you ask him nicely, he ___ help you.","o":["will","would","did","is"],"c":"will","w":"Das ist gut möglich: Typ 1 mit will."},{"t":"m","q":"If I had wings, I ___ fly over the school.","o":["would","will","can","am"],"c":"would","w":"Ausgedacht: Typ 2 mit would."},{"t":"m","q":"„If I won the lottery, I would travel the world.“ Welcher Typ ist das?","o":["Typ 2: ausgedacht","Typ 1: gut möglich"],"c":"Typ 2: ausgedacht","w":"simple past im if-Satz + would: Typ 2."},{"t":"m","q":"„If it is sunny, we will go to the lake.“ Welcher Typ ist das?","o":["Typ 1: gut möglich","Typ 2: ausgedacht"],"c":"Typ 1: gut möglich","w":"Präsens im if-Satz + will: Typ 1."},{"t":"t","q":"Wenn es morgen regnet, bleiben wir zu Hause.","a":["If it rains tomorrow, we will stay at home.","We will stay at home if it rains tomorrow.","If it rains tomorrow, we will stay home.","We will stay home if it rains tomorrow."],"w":"Möglich: if + Präsens, will + Infinitiv."},{"t":"t","q":"Wenn ich Flügel hätte, würde ich über die Schule fliegen.","a":["If I had wings, I would fly over the school.","I would fly over the school if I had wings."],"w":"Ausgedacht: if + simple past, would + Infinitiv."}]},{"id":"f-er","lang":"fr","unit":"Unité 2","name":"Verben auf -er","sub":"je cherche · nous cherchons","short":"Stamm + Endung: -e, -es, -e, -ons, -ez, -ent.","intro":"Fast alle französischen Verben auf **-er** werden gleich gebildet. Du nimmst den **Stamm** (Infinitiv ohne -er) und hängst die passende **Endung** an.","rules":[{"h":"Die Endungen","p":"chercher → Stamm cherch-: **je cherche**, **tu cherches**, **il/elle/on cherche**, **nous cherchons**, **vous cherchez**, **ils/elles cherchent**."},{"h":"Stumme und klingende Endungen","p":"**Stumm** sind -e, -es und -ent: je cherche, tu cherches, ils cherchent klingen wie il cherche. **Klingend** sind -ons und -ez: nous cherchons, vous cherchez. Sie hörst du."},{"h":"j’ vor Voka   if(t.indexOf('LH1:')!==0)return null;
  try{
    const o=JSON.parse(UN64(t.slice(4)));
    if(!o||o.v!==1||typeof o.points!=='number'||typeof o.days!=='object'||!Array.isArray(o.ps||[])||!Array.isArray(o.us||[]))return null;
    return o;
  }catch(e){return null;}
}
function stateFromCode(o){
  const st=defaultState();
  ['name','goal','points','days','vdir','math','exams','hiddenTopics','nameSkipped','mnOn','varied','bseen','tbest','tlog','vsort','srate','gp'].forEach(function(k){if(o[k]!==undefined)st[k]=o[k];});
  st.presetSeen=Array.isArray(o.presetSeen)?o.presetSeen:[];
  st.gp=(o.gp&&typeof o.gp==='object'&&!Array.isArray(o.gp))?o.gp:{};
  st.sets=[];
  (o.ps||[]).forEach(function(id){const p=PRESETS.find(function(x){return x.id===id;});if(p){const b=buildPreset(p,o.pc||{});if((o.hs||[]).indexOf(id)>=0)b.hidden=true;st.sets.push(b);}});
  (o.us||[]).forEach(function(x){st.sets.push(x);});
  return migrate(st);
}
function copyText(txt,ta,cb){
  const fb=function(){let ok=false;try{if(ta){ta.focus();ta.select();ta.setSelectionRange(0,txt.length);}ok=document.execCommand('copy');}catch(e){}cb(ok);};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){cb(true);},fb);return;}}catch(e){}
  fb();
}
function migrate(st){
  const gone=new Set();
  st.sets=(st.sets||[]).filter(function(x){if(x.builtin){gone.add(x.id);return false;}return true;});
  if(gone.size){
    st.exams=(st.exams||[]).map(function(e){if(e.subj!=='math')e.sets=(e.sets||[]).filter(function(id){return !gone.has(id);});return e;}).filter(function(e){return e.subj==='math'||(e.sets||[]).length>0;});
  }
  if(!Array.isArray(st.hiddenTopics))st.hiddenTopics=[];
  if(!Array.isArray(st.presetSeen))st.presetSeen=[];
  if(!st.gp||typeof st.gp!=='object')st.gp={};
  if(!Array.isArray(st.bseen))st.bseen=[];
  if(!Array.isArray(st.tlog))st.tlog=[];
  PRESETS.forEach(function(p){
    if(st.presetSeen.indexOf(p.id)>=0)return;
    st.presetSeen.push(p.id);
    st.sets.push(buildPreset(p));
  });
  st.sets.forEach(function(x){
    if(!x.preset)return;
    const p=PRESETS.find(function(y){return y.id===x.id;});if(!p)return;
    /* Eine Karte mit Preset-Nummer als Kennung wurde nie bearbeitet (Bearbeiten legt eine neue Karte an).
       Ihr Inhalt wird deshalb mit der aktuellen Vorlage abgeglichen; der Lernstand bleibt. */
    const have={};
    x.cards.forEach(function(c){
      have[c.id]=1;
      if(c.id.indexOf(p.id+'-')!==0)return;
      const d=p.cards[parseInt(c.id.slice(p.id.length+1),10)];if(!d)return;
      c.fx=d[0];c.de=d[1];
      ['ipa','ex','nt','mn'].forEach(function(k,j){if(d[j+2])c[k]=d[j+2];else delete c[k];});
    });
    const pn=typeof x.pn==='number'?x.pn:p.cards.length;
    for(let i=pn;i<p.cards.length;i++)if(!have[p.id+'-'+i])x.cards.push(presetCard(p,i));
    x.pn=p.cards.length;
  });
  return st;
}

function syToken(){
  const now=Date.now();
  if(sy.idToken&&sy.exp>now+60000)return Promise.resolve(sy.idToken);
  const store=function(idt,ref,exp){sy.idToken=idt;sy.refresh=ref;sy.exp=Date.now()+(parseInt(exp,10)||3600)*1000;sySave();return idt;};
  const signUp=function(){
    return syFetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:'{"returnSecureToken":true}'}).then(function(r){
      if(!r.ok||!r.json||!r.json.idToken)throw new Error('auth '+r.status);
      return store(r.json.idToken,r.json.refreshToken,r.json.expiresIn);
    });
  };
  if(sy.refresh){
    return syFetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(sy.refresh)}).then(function(r){
      if(r.ok&&r.json&&r.json.id_token)return store(r.json.id_token,r.json.refresh_token||sy.refresh,r.json.expires_in);
      return signUp();
    });
  }
  return signUp();
}

function voiceScore(v,tag){
  const n=(v.name||'').toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-');let sc=0;
  if(l===tag)sc+=50;
  if(/premium|enhanced|erweitert|verbessert|neural|natural|siri/.test(n))sc+=40;
  if(/compact|kompakt|espeak|robot/.test(n))sc-=40;
  if(/google/.test(n))sc+=8;
  if(v.localService)sc+=5;
  return sc;
}

  if(!list.length)return null;

  if(pref){const f=list.find(function(v){return v.name===pref;});if(f)return f;}
  return list.map(function(v){return {v:v,s:voiceScore(v,tag)};}).sort(function(x,y){return y.s-x.s;})[0].v;
}

  state.sets.forEach(function(x){if(x.lang===set.lang)x.cards.forEach(function(c){if(c.id!==card.id&&twins.indexOf(c.id)<0)pool.push(c);});});
  const known=pool.filter(function(c){return !c.u;});
  pool=shuffle(known.length>=6?known:pool);
  const out=[];
  for(let i=0;i<pool.length&&out.length<3;i++){
    const t=lab(pool[i]),k=t.toLowerCase();
    if(!seen[k]){seen[k]=1;out.push({t:t,ok:false});}
  }
  if(out.length<3)return null;
  out.push({t:right,ok:true});
  return shuffle(out);
}

}

/* ---------- Grammatik ---------- */
function gById(id){return GRAM.find(function(x){return x.id===id;});}
function gKey(t,i){return t.id+'#'+i;}
function gStat(t){
  const now=Date.now();let seen=0,safe=0,due=0;
  t.items.forEach(function(x,i){const q=state.gp[gKey(t,i)];if(q){seen++;if(q[0]>=3)safe++;if(q[1]<=now)due++;}});
  return {n:t.items.length,seen:seen,safe:safe,due:due,fresh:t.items.length-seen};
}
function gLevel(t){const r=gStat(t).safe/t.items.length;return r>=0.7?3:r>=0.3?2:1;}
function gSeg(){
  const l=state.vlang==='fr'?'fr':'en';
  return '<div class="seg" role="group" aria-label="Sprache">'+[['en','Englisch'],['fr','Französisch']].map(function(x){return '<button data-a="vlang" data-l="'+x[0]+'" aria-pressed="'+(l===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
}
function gramList(){
  const L=state.vlang==='fr'?'fr':'en';
  const list=GRAM.filter(function(x){return x.lang===L;}),order=[],by={};
  list.forEach(function(x){if(!by[x.unit]){by[x.unit]=[];order.push(x.unit);}by[x.unit].push(x);});
  if(state.vsort!=='old')order.reverse();
  let h=topBar()+'<div class="stack"><div><h1>Grammatik</h1><p class="muted">Lies zuerst die Regel, dann übst du mit kurzen Aufgaben. Zu jeder Antwort bekommst du den Grund.</p></div>'+gSeg();
  order.forEach(function(u){
    h+='<div class="stack" style="gap:10px"><h2>'+esc(u)+'</h2><div class="tiles">'+by[u].map(function(t){
      const st=gStat(t);
      return '<div class="tilebox"><button class="tile" data-a="gopen" data-t="'+t.id+'"><span class="t">'+esc(t.name)+'</span><span class="s">'+esc(t.sub)+'</span>'+pips(gLevel(t))+'<span class="s">'+st.safe+' von '+st.n+' sicher'+(st.due?' · '+st.due+' fällig':'')+'</span></button></div>';
    }).join('')+'</div></div>';
  });
  return h+'</div>';
}
function gramTopic(){
  const t=gById(ui.gt);
  if(!t){view='gram';return gramList();}
  const st=gStat(t),say=canSpeak();
  const sb=sayBtn('x','w','Beispiel anhören');
  return topBar()+'<div class="stack"><div><button class="link" data-a="go" data-v="gram">← Alle Themen</button><h1>'+esc(t.name)+'</h1></div>'+
    '<div class="card stack"><h2>Worum geht es?</h2><p>'+bx(t.intro)+'</p></div>'+
    '<div class="stack"><h2>Die Regeln</h2>'+t.rules.map(function(r){return '<div class="rule"><h3>'+esc(r.h)+'</h3><p>'+bx(r.p)+'</p></div>';}).join('')+'</div>'+
    '<div class="stack"><h2>Beispiele</h2>'+t.examples.map(function(e,i){return '<div class="exq"><p>'+esc(e)+'</p>'+(say?sb.replace('data-a="say" data-c="x" data-w="w"','data-a="gsay" data-e="'+i+'"'):'')+'</div>';}).join('')+'</div>'+
    '<p class="muted">'+st.safe+' von '+st.n+' Aufgaben sitzen sicher.'+(st.due?' '+st.due+' sind zur Wiederholung fällig.':'')+'</p>'+
    '<button class="btn block" data-a="gstart" data-t="'+t.id+'">Üben</button></div>';

function normG(s,lang){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'");
  if(lang==='en')s=s.replace(/won't/g,'will not').replace(/can't/g,'cannot').replace(/n't\b/g,' not').replace(/'d\b/g,' would').replace(/'ll\b/g,' will').replace(/'re\b/g,' are').replace(/'m\b/g,' am');
  return s.replace(/[.,!?;:"«»…]/g,' ').replace(/\s+/g,' ').trim();
}
function checkGram(user,answers,lang){
  const u=normG(user,lang);
  if(!u)return 'empty';
  const A=answers.map(function(a){return normG(a,lang);});
  const strip=function(x){return x.replace(/^(i|you|he|she|we|they|it) /,'');};
  if(A.indexOf(u)>=0||A.indexOf(strip(u))>=0)return 'ok';
  if(lang==='fr'){const fu=unAccent(u);if(A.some(function(a){return unAccent(a)===fu;}))return 'accent';}
  if(A.some(function(a){return a.length>=10&&lev(a,u)<=1;}))return 'typo';
  return 'wrong';
}
function gStart(tid){
  const t=gById(tid);if(!t)return;
  const now=Date.now(),due=[],fresh=[],rest=[];
  t.items.forEach(function(x,i){const q=state.gp[gKey(t,i)];if(!q)fresh.push(i);else if(q[1]<=now)due.push(i);else rest.push(i);});
  let ids=shuffle(due).concat(shuffle(fresh));
  if(ids.length<10)ids=ids.concat(shuffle(rest));
  ids=shuffle(ids.slice(0,10));
  ui.gs={tid:tid,queue:ids.map(function(i){const q=state.gp[gKey(t,i)];return {i:i,failed:false,early:!!(q&&q[1]>now)};}),total:ids.length,correct:0,pts:0,missed:[],phase:'ask',msg:'',keep:'',hinted:false,retried:false,rule:false,cur:null,fb:null};
  prepG();view='gsess';window.scrollTo(0,0);ui.focus=true;render();
}
function prepG(){
  const gs=ui.gs,q=gs.queue[0],t=gById(gs.tid),it=t.items[q.i];
  gs.cur={it:it,t:t,idx:q.i};gs.hinted=false;gs.retried=false;gs.msg='';gs.keep='';gs.rule=false;
  if(it.t==='m')gs.cur.opts=shuffle(it.o);
}
function gFill(it){return it.t==='g'?it.q.replace('___',it.a[0]):it.t==='m'?it.q+' '+it.c:it.a[0];}
function gFinish(ok,text){
  const gs=ui.gs,q=gs.queue.shift(),cur=gs.cur,it=cur.it,key=gKey(cur.t,q.i);
  const rec=state.gp[key]||[1,0,0];
  let gain=0,requeued=false;
  if(ok){
    gain=gs.hinted?5:gs.retried?6:(it.t==='m'?6:it.t==='t'?12:10);
    if(!q.failed){
      const clean=!gs.hinted&&!gs.retried;
      if(clean)gs.correct++;
      if(!q.early){
        if(clean){rec[0]=Math.min(5,rec[0]+1);if(rec[0]>=4)rec[2]=0;rec[1]=todayStart()+INTERVAL[rec[0]]*DAY;}
        else rec[1]=todayStart()+DAY;
      }
    }
    bump();
  }else{
    rec[0]=1;rec[1]=0;
    if(!q.failed){
      q.failed=true;requeued=true;rec[2]=(rec[2]||0)+1;
      gs.missed.push({q:it.t==='t'?it.q:gFill(it),a:it.t==='t'?it.a[0]:(it.t==='m'?it.c:it.a[0])});
      gs.queue.splice(Math.min(3,gs.queue.length),0,q);
    }
  }
  state.gp[key]=rec;
  gs.pts+=gain;addPts(gain);save();
  gs.fb={ok:ok,full:gFill(it),answer:it.t==='m'?it.c:it.a[0],why:it.w,text:ok?(text||'Richtig!')+(gain?' +'+gain:''):'',requeued:requeued};
  gs.phase='fb';ui.focus=true;render();
}
function gCheck(){
  const gs=ui.gs,cur=gs.cur,it=cur.it,val=$('ans').value;
  const r=checkGram(val,it.a,cur.t.lang);
  if(r==='empty'){gs.msg='Schreibe erst etwas hin.';gs.keep='';ui.focus=true;render();return;}
  if((r==='accent'||r==='typo')&&!gs.retried){
    gs.retried=true;gs.keep=val;
    gs.msg=(r==='accent'?'Fast richtig. Achte auf die Akzente.':'Fast richtig. Prüfe Schreibweise und Endungen noch einmal genau.')+' Versuch es noch einmal.';
    ui.focus=true;render();return;
  }
  if(r==='ok'){gFinish(true,gs.retried?'Richtig, beim zweiten Versuch!':'Richtig!');return;}
  gFinish(false);
}

  const gs=ui.gs;

function syJoin(raw,auto){
  const u=ui.sy||(ui.sy=freshSy());
  const cand=String(raw||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(cand.length<20){u.err='Der Code ist zu kurz. Er hat 24 Zeichen.';render();return;}
  u.err='';u.msg='';u.busy=true;render();
  const prev=sy.code;sy.code=cand;
  syGet().then(function(r){
    sy.code=prev;u.busy=false;
    if(r.none){u.err='Zu diesem Code gibt es noch keinen Stand. Prüfe die Eingabe.';return;}
    const o=parseCode(r.code);
    if(!o){u.err='Der Online-Stand lässt sich nicht lesen.';return;}
    u.pend={code:cand,ts:r.ts,o:o};
    if(auto&&isLocalEmpty())syTake();
  }).catch(function(e){sy.code=prev;u.busy=false;u.err='Das hat nicht geklappt: '+errText(e)+'.';}).then(function(){if(view==='sync')render();});
}
function syTake(){
  const p=ui.sy.pend;
  state=stateFromCode(p.o);state.ts=p.ts;save(true);
  sy.code=p.code;sy.pushed=p.ts;sy.last=Date.now();sy.err='';sySave();
  ui.flash='Verbunden. Dein Lernstand ist da.';ui.sy=null;go('home');
}
function syKeep(){
  const u=ui.sy,p=u.pend;
  sy.code=p.code;state.ts=Date.now();save(true);u.busy=true;render();
  syncPush().then(function(){ui.flash='Verbunden. Dieser Stand liegt jetzt online.';ui.sy=null;go('home');}).catch(function(e){sy.code='';sySave();u.busy=false;u.err='Das hat nicht geklappt: '+errText(e)+'.';render();});
}

/* ---------- Vokabeln: Ablauf ---------- */
function startVocab(scope,force,newOnly){
  let pool=[],examId=null,phase='';
  if(scope==='knack')force=true;
  if(scope==='knack'){
    knackList().forEach(function(x){pool.push(x);});
  }else if(scope.indexOf('exam:')===0){
    const e=getExam(scope.slice(5));
    if(!e){go('exams');return;}
    examId=e.id;pool=examCardsOf(e);phase=examPlan(e).pl.phase;
  }else{
    const sets=scope==='all'?vlangSets():state.sets.filter(function(s){return s.id===scope;});
    sets.forEach(function(s){s.cards.forEach(function(c){pool.push({s:s,c:c});});});
  }
  if(!pool.length){go(examId?'exams':'vocab');return;}
  const now=Date.now();
  const fresh=pool.filter(function(x){return x.c.u;}),seen=pool.filter(function(x){return !x.c.u;});
  let pick10;
  if(newOnly){
    pick10=fresh.slice(0,NEWMAX);
  }else if(examId){
    let cand=seen;
    if(phase==='repeat'){const weak=seen.filter(function(x){return x.c.box<=3;});if(weak.length)cand=weak;}
    const nw=fresh.slice(0,NEWMAX);
    pick10=nw.concat(shuffle(cand).sort(function(a,b){return ((a.c.due<=now?0:1)-(b.c.due<=now?0:1))||(a.c.box-b.c.box);}).slice(0,10-nw.length));
  }else{
    const due=seen.filter(function(x){return x.c.due<=now;});
    pick10=(due.length&&!force)?shuffle(due).sort(function(a,b){return a.c.box-b.c.box;}).slice(0,10):shuffle(seen).slice(0,10);
  }
  if(!pick10.length){go(examId?'exams':'vocab');return;}
  const queue=shuffle(pick10).map(function(x){
    const dir=state.vdir==='mixed'?(Math.random()<.5?'d2f':'f2d'):state.vdir;
    return {sid:x.s.id,cid:x.c.id,dir:dir,failed:false};
  });
  const intro=pick10.filter(function(x){return x.c.u;}).map(function(x){return {sid:x.s.id,cid:x.c.id};});
  ui.vs={queue:queue,total:queue.length,correct:0,pts:0,missed:[],phase:'ask',retried:false,hinted:false,hint:'',keep:'',msg:'',fb:null,examId:examId,intro:intro,ii:0};
  prepVocab();
  view=intro.length?'vintro':'vsess';ui.focus=!intro.length;window.scrollTo(0,0);render();
}
function prepVocab(){
  const vs=ui.vs,q=vs.queue[0];if(!q)return;
  const set=getSet(q.sid),card=set.cards.find(function(c){return c.id===q.cid;});
  const toDe=q.dir==='f2d';
  const type=q.failed?'type':pickType(card,set,toDe);
  const cur={prompt:toDe?card.fx:deShow(card.de),toDe:toDe,set:set,answer:toDe?card.de:card.fx,side:toDe?'de':set.lang,dirLabel:toDe?langName(set.lang)+' → Deutsch':'Deutsch → '+langName(set.lang),card:card,type:'type'};
  if(type==='mc'){
    const o=mcOptions(card,set,toDe);
    if(o){cur.type='mc';cur.opts=o;}
  }else if(type==='gap'){
    const g=gapOf(card);
    if(g){cur.type='gap';cur.prompt=String(card.ex).replace(/\*[^*]+\*/,'_____').replace(/\*/g,'');cur.answer=g;cur.side=set.lang;cur.toDe=false;cur.dirLabel='Lückensatz';cur.gapHint=deShow(card.de);}
  }else if(type==='listen'){
    cur.type='listen';cur.prompt='Hör zu und schreib das Wort auf';cur.answer=card.fx;cur.side=set.lang;cur.toDe=false;cur.dirLabel='Hören';
  }
  vs.cur=cur;
  vs.speakPending=(cur.type==='listen');
  vs.retried=false;vs.hinted=false;vs.hint='';vs.keep='';vs.msg='';
}
function vFinish(ok,text){
  const vs=ui.vs,q=vs.queue[0],cur=vs.cur,card=cur.card;
  let gain=0;
  vs.queue.shift();
  let requeued=false;
  if(ok){
    gain=vs.hinted?5:vs.retried?6:(cur.type==='mc'?6:10);
    if(!q.failed){
      if(!vs.hinted&&!vs.retried){
        vs.correct++;if(vs.examId)addExamProg(vs.examId);
        card.box=Math.min(5,card.box+1);if(card.box>=4)card.f=0;
        card.due=todayStart()+INTERVAL[card.box]*DAY;
      }else{
        card.due=todayStart()+DAY;
      }
    }
    bump();
  }else{
    card.box=1;card.due=0;
    if(!q.failed){
      q.failed=true;requeued=true;card.f=(card.f||0)+1;
      vs.missed.push({fx:card.fx,de:card.de});
      vs.queue.splice(Math.min(3,vs.queue.length),0,q);
    }
  }
  vs.pts+=gain;addPts(gain);save();
  vs.fb={ok:ok,answer:cur.answer.replace(/\s*\/\s*/g,' / '),text:ok?(text||'Richtig!')+(gain?' +'+gain:''):'',requeued:requeued};
  vs.promptShown=cur.prompt;vs.dirLabel=cur.dirLabel;vs.fbCard={c:card,s:cur.set};
  vs.phase='fb';ui.focus=true;render();
}
function vCheck(){
  const vs=ui.vs,cur=vs.cur,val=$('ans').value;
  const res=checkVocab(val,cur.answer,cur.side);
  if(res.r==='empty'){vs.msg='Schreibe erst etwas hin.';vs.keep='';ui.focus=true;render();return;}
  if(res.r!=='ok'&&cur.type==='gap'&&!vs.retried&&checkVocab(val,cur.card.fx,cur.side).r==='ok'){
    vs.retried=true;vs.msg='Fast richtig. Das Wort stimmt, es muss aber noch zum Satz passen (Zeitform, Mehrzahl oder Endung).';vs.keep=val;ui.focus=true;render();return;
  }
  if(res.r!=='ok'&&cur.type==='type'&&!cur.toDe){
    const tw=sameDe(cur.card,cur.set).find(function(c){return checkVocab(val,c.fx,cur.set.lang).r==='ok';});
    if(tw){vFinish(true,'Richtig! Hier passt auch '+tw.fx+'.');return;}
  }
  if(res.r==='almost'&&!vs.retried){vs.retried=true;vs.msg=res.msg+' Versuch es noch einmal.';vs.keep=val;ui.focus=true;render();return;}
  if(res.r==='ok'){vFinish(true,vs.retried?'Richtig, beim zweiten Versuch!':'Richtig!');return;}
  vFinish(false);
}
function vNext(){

/* ---------- Mathe: Ablauf ---------- */
function newItem(tid,prevQ){
  let id,review=false;
  if(tid==='mix')id=pick(visibleTopics()).id;
  else if(tid.indexOf('exam:')===0){const e=getExam(tid.slice(5));const ids=e?examTopics(e):[];id=ids.length?pickTopic(ids):pick(TOPICS).id;}
  else{id=tid;if(Math.random()<0.25){const others=visibleTopics().filter(function(x){return x.id!==tid&&((state.math[x.id]||{}).n||0)>=5;});if(others.length){id=pick(others).id;review=true;}}}
  const t=TOPICS.find(function(x){return x.id===id;});
  const lvl=mstat(id).level;
  let it,tries=0;
  do{it=t.gen(lvl);tries++;}while(prevQ&&it.q===prevQ&&tries<6);
  it.topicId=id;it.level=lvl;it.review=review;
  return it;
}
function startMath(tid){
  ui.ms={tid:tid,examId:(tid.indexOf('exam:')===0?tid.slice(5):null),solved:0,pts:0,item:newItem(tid),tips:0,attempts:0,phase:'ask',msg:'',keep:'',result:'',gain:0,lvlmsg:''};
  view='msess';window.scrollTo(0,0);ui.focus=true;render();
}
function mCheck(){
  const m=ui.ms,it=m.item,val=$('ans').value.trim();
  m.keep=val;
  if(!val){m.msg='Trage erst deine Antwort ein.';ui.focus=true;render();return;}
  const r=it.kind==='lin'?checkLin(val,it.ans):checkNum(val,it.ans);
  if(r==='format'){m.msg=it.kind==='lin'?'So schreibst du das Ergebnis: 4x + 2. Wenn keine Zahl übrig bleibt, nur 4x.':'Schreibe nur eine Zahl, zum Beispiel 12, '+MINUS+'3 oder 4,5.';ui.focus=true;render();return;}
  if(r==='notsimple'){m.msg='Fasse noch weiter zusammen. Am Ende steht nur ein Term mit x und eine Zahl da.';ui.focus=true;render();return;}
  m.attempts++;
  if(r==='ok'){
    const st=mstat(it.topicId);
    m.gain=Math.max(3,15-5*m.tips-(m.attempts>1?3:0));
    m.pts+=m.gain;m.solved++;addPts(m.gain);bump();if(m.examId)addExamProg(m.examId);
    st.n=(st.n||0)+1;
    const clean=m.tips===0&&m.attempts===1;
    st.fail=0;
    if(clean){st.clean++;if(st.clean>=3&&st.level<3){st.level++;st.clean=0;m.lvlmsg='Stark. Weiter geht es mit Stufe '+st.level+'.';}}
    else st.clean=0;
    m.phase='done';m.result='solved';save();ui.focus=true;render();return;
  }
  const pv=it.kind==='num'?parseNum(val):null;
  const slip=pv!==null&&it.ans!==0&&Math.abs(pv+it.ans)<0.005;
  m.msg=slip?'Fast. Die Zahl stimmt, aber das Vorzeichen nicht. Pr\u00FCfe Plus und Minus noch einmal.':(m.attempts>=2?'Noch nicht richtig. Ein Tipp oder die Erkl\u00E4rung kann helfen.':'Noch nicht richtig. Rechne in Ruhe noch einmal nach.');
  ui.focus=true;render();
}
function mSol(){
  const m=ui.ms,st=mstat(m.item.topicId);
  st.clean=0;st.fail++;
  if(st.fail>=2&&st.level>1){st.level--;st.fail=0;m.lvlmsg='Wir üben auf Stufe '+st.level+' weiter. Das sitzt gleich.';}
  m.phase='done';m.result='solution';save();ui.focus=true;render();
}
function mNext(){
  const m=ui.ms;
  m.item=newItem(m.tid,m.item.q);m.tips=0;m.attempts=0;m.phase='ask';m.msg='';m.keep='';m.result='';m.lvlmsg='';
  ui.focus=true;render();
}

      syncPush().then(function(){u.msg='Online-Abgleich ist an. Verbinde jetzt die anderen Geräte.';}).catch(function(e){sy.code='';u.err='Das hat nicht geklappt: '+errText(e)+'.';}).then(function(){u.busy=false;sySave();if(view==='sync')render();});
      break;}
    case 'syjoin':{const el=$('syin');syJoin(el?el.value:'',false);break;}
    case 'sytake':{syTake();break;}
    case 'sykeep':{syKeep();break;}
    case 'syno':{ui.sy.pend=null;ui.sy.err='';render();break;}
    case 'synow':{
      const u=ui.sy;u.busy=true;u.msg='';u.err='';render();
      syBusy=false;
      syncPull(true).then(function(){u.busy=false;if(sy.err)u.err=sy.err;else u.msg='Abgeglichen.';if(view==='sync')render();});
      break;}
    case 'sycopy':{
      copyText($('sylink').value,$('sylink'),function(ok){ui.sy.msg=ok?'Link kopiert. Füge ihn zum Beispiel in eine Nachricht an dich ein.':'Kopieren hat nicht geklappt. Tippe in das Feld, markiere alles und kopiere es von Hand.';render();});
      break;}
    case 'syoff':{ui.sy.confirmOff=true;render();break;}
    case 'syoffno':{ui.sy.confirmOff=false;render();break;}
    case 'syoffyes':{clearTimeout(syTimer);sy.code='';sySave();ui.sy=freshSy();ui.sy.msg='Dieses Gerät ist getrennt.';render();break;}
    case 'reset':ui.confirmReset=true;render();break;
    case 'resetno':ui.confirmReset=false;render();break;
    case 'resetyes':state=migrate(defaultState());save();ui={};go('home');break;
  }
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.id==='exsubj'&&ui.ex){
    const dt=$('exdate'),date=dt?dt.value:'';
    ui.ex=newEx(ev.target.value);ui.ex.date=date;render();
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  if(view==='tsess'){
    if(ev.target.id==='ans'&&ui.tt&&!ui.tt.done){ev.preventDefault();tNext();}
  }else if(view==='vsess'){
    const vs=ui.vs;
    if(vs.phase==='ask'&&ev.target.id==='ans'){ev.preventDefault();vCheck();}
  }else if(view==='msess'){
    if(ui.ms.phase==='ask'&&ev.target.id==='ans'){ev.preventDefault();mCheck();}
  }else if(view==='gsess'){
    const gs=ui.gs;
    if(gs&&gs.phase==='ask'&&ev.target.id==='ans'){ev.preventDefault();gCheck();}
    else if(gs&&gs.phase==='fb'&&ev.target.id!=='nextbtn'){ev.preventDefault();gNext();}
  }else if(view==='home'&&ev.target.id==='nm'){
    ev.preventDefault();const v=(ev.target.value||'').trim();if(v)state.name=v;else state.nameSkipped=true;save();render();
  }
});
(function(){
  if(!syncAvail())return;
  const m=/^#sync=([A-Za-z0-9-]+)/.exec(location.hash||'');
  if(!m)return;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(sy.code)return;
  view='sync';ui.sy=freshSy();
  setTimeout(function(){syJoin(m[1],true);},0);
})();
document.addEventListener('visibilitychange',function(){
  if(!syncOn())return;
  if(document.visibilityState==='visible'){syncPull().then(function(ch){if(ch)render();});}
  else if(syTimer){clearTimeout(syTimer);syTimer=null;syncPush().catch(function(){});}
});
window.addEventListener('online',function(){if(syncOn())syncPull().then(function(ch){if(ch)render();});});
render();
syncPull().then(function(ch){if(ch)render();});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if(canSpeak()){window.speechSynthesis.onvoiceschanged=function(){const f=$('vfr'),e=$('ven');if(f)f.innerHTML=voiceOptions('fr');if(e)e.innerHTML=voiceOptions('en');};}}catch(e){}
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
