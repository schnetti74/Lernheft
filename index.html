<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D6B8A">
<style>:root{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lernheft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: eine Spalte, Tab-Leiste unten. Vokabeln als Karteikasten mit 5 Fächern, Mathe auf Karopapier. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --ink:#16203A; --muted:#566180; --line:#D8DFEC;
  --accent:#0D6B8A; --accent-ink:#FFFFFF; --mark:#FFD84A; --mark-ink:#16203A; --tipbg:#FFF3BF;
  --good:#1B7F52; --good-bg:#E3F4EB; --bad:#B93A2A; --bad-bg:#FBE9E5; --grid:#DCE6F4;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1526; --surface:#18213A; --ink:#E9EEF9; --muted:#9DA9C8; --line:#2A3655;
    --accent:#55C7E4; --accent-ink:#08202A; --mark:#E9C13B; --mark-ink:#16203A; --tipbg:#3A3416;
    --good:#5FD39A; --good-bg:#123327; --bad:#FF8C7A; --bad-bg:#3A1D1A; --grid:#243251;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1526; --surface:#18213A; --ink:#E9EEF9; --muted:#9DA9C8; --line:#2A3655;
  --accent:#55C7E4; --accent-ink:#08202A; --mark:#E9C13B; --mark-ink:#16203A; --tipbg:#3A3416;
  --good:#5FD39A; --good-bg:#123327; --bad:#FF8C7A; --bad-bg:#3A1D1A; --grid:#243251;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
.app{max-width:640px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.01em;background:linear-gradient(transparent 58%,var(--mark) 58%);padding:0 4px;margin-left:-4px;color:var(--ink)}
.pts{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--muted)}
.pts b{color:var(--ink);font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.btn.ghost.danger{background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.link{font:inherit;background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 0;min-height:44px}
.input,.select,.area{font:inherit;font-size:19px;width:100%;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.area{font-size:16px;min-height:200px;line-height:1.5;resize:vertical}
.input:focus,.select:focus,.area:focus{border-color:var(--accent);outline:none}
label.lab{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{min-width:44px;min-height:44px;font:inherit;font-size:19px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:0 8px}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;font:inherit;font-weight:700;font-size:15px;min-height:46px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;padding:6px 4px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.15}
.tile .s{font-size:14px;color:var(--muted)}
.tile.mark{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.tile.mark .s{color:var(--mark-ink)}
.pips{display:flex;gap:5px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.ring{display:block}
.r-bg{fill:none;stroke:var(--line);stroke-width:9}
.r-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round}
.ring text{font-family:var(--font-display);font-weight:800;font-size:24px;fill:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end}
.bx{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drawer{width:100%;height:44px;border:2px solid var(--ink);border-radius:3px 3px 7px 7px;background:var(--bg);display:flex;align-items:flex-end;overflow:hidden}
.drawer i{display:block;width:100%;height:var(--h);background:var(--mark)}
.bx b{color:var(--ink);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.paper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.q{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.5}
.q span{background:var(--surface);box-shadow:0 0 0 5px var(--surface);border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.big{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.2;overflow-wrap:anywhere}
.fb{border-radius:12px;padding:12px 14px;font-weight:600}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.tip{background:var(--tipbg);border-radius:10px;padding:10px 12px;font-size:16px}
.tip b{font-family:var(--font-display)}
.ansrow{display:flex;gap:8px;align-items:center}
.ansrow .pre,.ansrow .unit{font-weight:700;font-size:20px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:12px}
.setcard{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.words{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface)}
.words div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.words div:last-child{border-bottom:0}
.words span{min-width:0;overflow-wrap:anywhere}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav[hidden]{display:none!important}
.nav .in{display:flex;gap:6px;width:100%;max-width:640px}
.nav button{flex:1;font:inherit;font-weight:700;font-size:15px;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{background:var(--mark);color:var(--mark-ink)}
.err{color:var(--bad);font-weight:700;font-size:15px}
.chks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.exc{border:2px solid var(--accent)}
.exc.urgent{background:var(--tipbg)}
.exrow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.big{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>

</head>
<body>
<div id="app" class="app"></div>
<nav id="nav" class="nav"></nav>

<script>
// ==LOGIC-START==
const MINUS='−';
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
const round2=n=>Math.round(n*100)/100;
const fmt=n=>String(round2(n)).replace('.',',').replace('-',MINUS);
const br=n=>n<0?'('+fmt(n)+')':fmt(n);
const tm=n=>n<0?MINUS+' '+fmt(-n):'+ '+fmt(n);
const eur=n=>round2(n).toFixed(2).replace('.',',')+' €';
const sign=()=>Math.random()<.5?-1:1;

function linStr(terms){
  return terms.map(function(t,i){
    const c=t[0],isx=t[1],abs=Math.abs(c);
    const body=isx?(abs===1?'x':fmt(abs)+'x'):fmt(abs);
    if(i===0)return (c<0?MINUS:'')+body;
    return (c<0?' '+MINUS+' ':' + ')+body;
  }).join('');
}

/* ---------- Mathe-Aufgaben ---------- */
function genNeg(l){
  if(l===1){
    const a=ri(-12,12)||5,b=ri(1,12)*sign(),plus=Math.random()<.5;
    const ans=plus?a+b:a-b;
    const q='Berechne: '+fmt(a)+' '+(plus?'+':MINUS)+' '+br(b);
    let t1,t2;
    if(plus){
      const same=(a<0)===(b<0),A=Math.abs(a),B=Math.abs(b);
      t1='Gleiche Vorzeichen: Beträge addieren und das Vorzeichen behalten. Verschiedene Vorzeichen: den kleineren Betrag vom größeren abziehen.';
      t2='Die Beträge sind '+A+' und '+B+'. '+(same?'Gleiche Vorzeichen: rechne '+A+' + '+B+' und setze '+(a<0?'ein Minus':'ein Plus')+' davor.':'Verschiedene Vorzeichen: rechne '+Math.max(A,B)+' '+MINUS+' '+Math.min(A,B)+'. Das Vorzeichen hat die Zahl mit dem größeren Betrag.');
    }else{
      t1='Minus eine Zahl ist dasselbe wie plus die Gegenzahl.';
      t2=fmt(a)+' '+MINUS+' '+br(b)+' wird zu '+fmt(a)+' + '+br(-b)+'. Rechne jetzt wie bei einer Addition.';
    }
    return {q:q,unit:'',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)};
  }
  if(l===2){
    const mult=Math.random()<.5,b=ri(2,9)*sign();
    let a,ans,q,op;
    if(mult){a=ri(2,9)*sign();ans=a*b;op='·';q='Berechne: '+br(a)+' · '+br(b);}
    else{ans=ri(2,9)*sign();a=b*ans;op=':';q='Berechne: '+br(a)+' : '+br(b);}
    const same=(a<0)===(b<0);
    const t1='Gleiche Vorzeichen ergeben Plus, verschiedene Vorzeichen ergeben Minus.';
    const t2='Ohne Vorzeichen: '+Math.abs(a)+' '+op+' '+Math.abs(b)+' = '+Math.abs(ans)+'. '+(same?'Gleiche Vorzeichen, also Plus.':'Verschiedene Vorzeichen, also Minus.');
    return {q:q,unit:'',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)};
  }
  const a=ri(-6,6)||3,b=ri(-6,6)||2,c=ri(-15,15)||4;
  const ans=a*b+c;
  const t1='Punkt vor Strich: Rechne zuerst die Malaufgabe.';
  const t2=br(a)+' · '+br(b)+' = '+fmt(a*b)+'. Danach bleibt '+fmt(a*b)+' + '+br(c)+'.';
  return {q:'Berechne: '+br(a)+' · '+br(b)+' + '+br(c),unit:'',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)};
}

function genProz(l){
  const ps=[5,10,15,20,25,30,40,50,60,75,80];
  if(l===1){
    const G=pick([20,40,60,80,100,120,160,200,240,300,400,500]),p=pick([5,10,20,25,50,75]);
    const W=G*p/100;
    const t1='Teile den Grundwert durch 100, das sind 1 %. Dann nimm das mal den Prozentsatz.';
    const t2=G+' : 100 = '+fmt(G/100)+'. Das ist 1 %. Jetzt mal '+p+'.';
    return {q:'Berechne '+p+' % von '+G+'.',unit:'',pre:'',kind:'num',ans:W,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(W)};
  }
  if(l===2){
    const t=pick(['wert','satz','grund']);
    if(t==='wert'){
      const G=pick([40,60,80,120,160,200,240,300]),p=pick([10,15,20,25,30,40]),W=G*p/100;
      const t1='Teile den Preis durch 100, das sind 1 %. Dann mal den Prozentsatz.';
      const t2=G+' : 100 = '+fmt(G/100)+'. Das mal '+p+' ergibt den Rabatt.';
      return {q:'Ein Fahrrad kostet '+G+' €. Du bekommst '+p+' % Rabatt. Wie viel Euro sparst du?',unit:'€',pre:'',kind:'num',ans:W,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(W)+' €'};
    }
    if(t==='satz'){
      const G=pick([20,40,50,100,200]),p=pick(ps.concat([35,45,55,65])),W=G*p/100;
      const t1='Rechne aus, wie viel 1 % ist. Dann prüfe, wie oft das in den Teil passt.';
      const t2='1 % von '+G+' sind '+fmt(G/100)+'. Wie oft passt '+fmt(G/100)+' in '+fmt(W)+'?';
      return {q:'Von '+G+' Kindern bringen '+W+' ein Haustier mit. Wie viel Prozent sind das?',unit:'%',pre:'',kind:'num',ans:p,tips:[t1,t2],sol:t2+' Ergebnis: '+p+' %'};
    }
    const G=pick([100,200,300,400,500,800,1000]),p=pick([5,10,20,25,40,50]),W=G*p/100;
    const t1='Rechne zuerst aus, wie viel 1 % ist: Teil durch Prozentsatz.';
    const t2=W+' : '+p+' = '+fmt(W/p)+' sind 1 %. Das mal 100 ergibt das Ganze.';
    return {q:W+' Schülerinnen und Schüler sind '+p+' % aller Kinder einer Schule. Wie viele Kinder hat die Schule?',unit:'',pre:'',kind:'num',ans:G,tips:[t1,t2],sol:t2+' Ergebnis: '+G};
  }
  const t=pick(['minus','plus','mwst']);
  if(t==='mwst'){
    const G=pick([100,200,300,400,500]),W=G*19/100;
    const t1='Rechne zuerst die Steuer aus (19 % vom Preis), dann addiere sie.';
    const t2='19 % von '+G+' sind '+fmt(W)+'. Das kommt zum Preis dazu.';
    return {q:'Ein Laptop kostet ohne Mehrwertsteuer '+G+' €. Dazu kommen 19 % Mehrwertsteuer. Wie viel kostet er mit Steuer?',unit:'€',pre:'',kind:'num',ans:G+W,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(G+W)+' €'};
  }
  const G=pick([40,60,80,120,160,200]),p=pick([10,15,20,25,30,40]),W=G*p/100;
  const minus=t==='minus';
  const q=minus?('Eine Jacke kostet '+G+' €. Im Sale sinkt der Preis um '+p+' %. Wie viel kostet sie jetzt?'):('Ein Spiel kostet '+G+' €. Der Preis steigt um '+p+' %. Wie viel kostet es danach?');
  const t1=minus?'Rechne zuerst den Rabatt in Euro aus, dann ziehe ihn vom Preis ab.':'Rechne zuerst die Erhöhung in Euro aus, dann addiere sie zum Preis.';
  const t2=p+' % von '+G+' sind '+fmt(W)+' €. '+(minus?'Ziehe das von '+G+' ab.':'Addiere das zu '+G+'.');
  const ans=minus?G-W:G+W;
  return {q:q,unit:'€',pre:'',kind:'num',ans:ans,tips:[t1,t2],sol:t2+' Ergebnis: '+fmt(ans)+' €'};
}

function genGl(l){
  if(l===1){
    const t=pick(['plus','minus','mal']);
    if(t==='plus'){const a=ri(2,15),x=ri(1,20),b=x+a;return {q:'Löse: x + '+a+' = '+b,unit:'',pre:'x =',kind:'num',ans:x,tips:['Mach auf beiden Seiten das Gegenteil: aus plus wird minus.','Ziehe auf beiden Seiten '+a+' ab: x = '+b+' '+MINUS+' '+a+'.'],sol:'x = '+b+' '+MINUS+' '+a+' = '+x};}
    if(t==='minus'){const a=ri(2,15),x=ri(1,20),b=x-a;return {q:'Löse: x '+MINUS+' '+a+' = '+fmt(b),unit:'',pre:'x =',kind:'num',ans:x,tips:['Mach auf beiden Seiten das Gegenteil: aus minus wird plus.','Addiere auf beiden Seiten '+a+': x = '+fmt(b)+' + '+a+'.'],sol:'x = '+fmt(b)+' + '+a+' = '+x};}
    const a=ri(2,9),x=ri(2,12),b=a*x;
    return {q:'Löse: '+a+'x = '+b,unit:'',pre:'x =',kind:'num',ans:x,tips:['Teile beide Seiten durch die Zahl vor dem x.','x = '+b+' : '+a],sol:'x = '+b+' : '+a+' = '+x};
  }
  if(l===2){
    const a=ri(2,9),x=ri(1,12),b=ri(-12,12)||5,c=a*x+b;
    const t1='Bringe zuerst die Zahl ohne x auf die andere Seite. Teile dann durch die Zahl vor dem x.';
    const t2=fmt(c)+' '+(b>=0?MINUS:'+')+' '+Math.abs(b)+' = '+fmt(c-b)+'. Jetzt steht '+a+'x = '+fmt(c-b)+'. Teile durch '+a+'.';
    return {q:'Löse: '+a+'x '+tm(b)+' = '+fmt(c),unit:'',pre:'x =',kind:'num',ans:x,tips:[t1,t2],sol:t2+' x = '+x};
  }
  if(Math.random()<.5){
    let a,c,x,b,d,tries=0;
    do{a=ri(4,9);c=ri(1,a-1);x=ri(-6,10)||2;b=ri(-10,10)||3;d=(a-c)*x+b;tries++;}while(d===0&&tries<20);
    const t1='Bringe alle x auf eine Seite und alle Zahlen auf die andere.';
    const t2='Ziehe '+c+'x auf beiden Seiten ab: '+(a-c)+'x '+tm(b)+' = '+fmt(d)+'. Schaffe dann die Zahl '+fmt(b)+' auf die rechte Seite.';
    return {q:'Löse: '+a+'x '+tm(b)+' = '+c+'x '+tm(d),unit:'',pre:'x =',kind:'num',ans:x,tips:[t1,t2],sol:t2+' x = '+x};
  }
  let a,x,b,c,tries=0;
  do{a=ri(2,6);x=ri(-5,9);b=ri(-6,8)||2;c=a*(x+b);tries++;}while(c===0&&tries<20);
  const t1='Teile zuerst beide Seiten durch '+a+'. Dann bleibt die Klammer allein.';
  const t2='x '+tm(b)+' = '+fmt(c/a)+'. Jetzt noch '+fmt(b)+' auf die andere Seite bringen.';
  return {q:'Löse: '+a+'(x '+tm(b)+') = '+fmt(c),unit:'',pre:'x =',kind:'num',ans:x,tips:[t1,t2],sol:t2+' x = '+x};
}

function genTerm(l){
  if(l===1){
    let a,b,c,A;
    do{a=ri(1,9);b=ri(1,9)*sign();c=ri(1,9)*sign();A=a+b+c;}while(A===0);
    const terms=[[a,1],[b,1],[c,1]];
    const t1='Alle Terme haben x. Du rechnest nur die Zahlen vor dem x zusammen.';
    const t2='Rechne '+linStr(terms.map(function(t){return [t[0],0];}))+' = '+fmt(A)+'. Das x bleibt stehen.';

/* ---------- Antworten prüfen: Mathe ---------- */
function parseNum(s){
  s=String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');
  s=s.replace(',','.').replace(/^[a-z]=/,'').replace(/[a-z€°%]+$/g,'');
  if(!/^-?\d+(\.\d+)?$/.test(s))return null;
  return parseFloat(s);
}
function checkNum(user,ans){
  const v=parseNum(user);
  if(v===null)return 'format';
  return Math.abs(v-ans)<0.005?'ok':'wrong';
}
function parseLin(s){
  s=String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[*·]/g,'').replace(/,/g,'.').replace(/^[a-z]=/,'');
  if(!s||!/^[+-]?(\d*\.?\d*x|\d+\.?\d*)([+-](\d*\.?\d*x|\d+\.?\d*))*$/.test(s))return null;
  const toks=s.match(/[+-]?(\d*\.?\d*x|\d+\.?\d*)/g)||[];
  let a=0,b=0,nx=0,nn=0;
  toks.forEach(function(t){
    if(t.slice(-1)==='x'){
      const c=t.slice(0,-1);
      a+=(c===''||c==='+')?1:(c==='-'?-1:parseFloat(c));nx++;
    }else{b+=parseFloat(t);nn++;}
  });
  if(isNaN(a)||isNaN(b))return null;
  return {a:a,b:b,nx:nx,nn:nn};
}
function checkLin(user,ans){
  const p=parseLin(user);
  if(!p)return 'format';
  if(p.nx>1||p.nn>1)return 'notsimple';
  return Math.abs(p.a-ans.a)<1e-9&&Math.abs(p.b-ans.b)<1e-9?'ok':'wrong';
}

/* ---------- Antworten prüfen: Vokabeln ---------- */
const unAccent=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae');
const normV=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\(.*?\)/g,' ').replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
function altsOf(raw){return String(raw).split(/[\/;]/).map(normV).filter(Boolean);}
function formsOf(alt,side){
  const f=[alt];
  if(side==='en'&&alt.indexOf('to ')===0)f.push(alt.slice(3));
  if(side==='de'){
    const m=alt.replace(/^(der|die|das|ein|eine|sich) /,'');
    if(m!==alt)f.push(m);
  }
  return f;
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  let prev=[];for(let j=0;j<=n;j++)prev.push(j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur.push(Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)));
    }
    prev=cur;
  }
  return prev[n];
}
function checkVocab(user,answerRaw,side){
  const u=normV(user);
  if(!u)return {r:'empty'};
  const alts=altsOf(answerRaw);
  for(let i=0;i<alts.length;i++){if(formsOf(alts[i],side).indexOf(u)>=0)return {r:'ok'};}
  for(let i=0;i<alts.length;i++){
    const fs=formsOf(alts[i],side);
    for(let k=0;k<fs.length;k++){
      const f=fs[k];
      if(unAccent(u)===unAccent(f))return {r:'almost',msg:'Fast richtig. Schau noch mal auf Akzente und Sonderzeichen.'};
      if(side==='fr'){
        const m=f.replace(/^(le |la |les |l'|un |une )/,'');
        if(m!==f&&u===m)return {r:'almost',msg:'Fast richtig. Denk an den Artikel.'};
      }
      if(f.length>=5&&lev(u,f)<=1)return {r:'almost',msg:'Fast richtig. Ein Buchstabe stimmt noch nicht.'};
    }
  }
  return {r:'wrong'};
}
function parseLines(text){
  const cards=[];let skipped=0;
  String(text).split(/\r?\n/).forEach(function(line){
    if(!line.trim())return;
    let i=line.indexOf('=');
    if(i<0)i=line.indexOf('\t');
    if(i<0){skipped++;return;}
    const fx=line.slice(0,i).trim(),de=line.slice(i+1).trim();
    if(!fx||!de){skipped++;return;}
    cards.push({fx:fx,de:de});
  });
  return {cards:cards,skipped:skipped};
}
function daysUntil(ds,now){
  const p=String(ds).split('-').map(Number);
  const t=new Date(p[0],p[1]-1,p[2]).getTime();
  const n=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  return Math.round((t-n)/86400000);
}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function dateLong(ds){const p=String(ds).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);return WD[d.getDay()]+', '+p[2]+'.'+p[1]+'.'+p[0];}
function quotaToday(startRemaining,daysLeft){
  if(daysLeft<0)return {phase:'over',quota:0};
  if(daysLeft===0)return {phase:'today',quota:0};
  const phase=daysLeft<=2?'repeat':'build';
  if(startRemaining<=0)return {phase:phase,quota:phase==='repeat'?8:0};
  const q=Math.ceil(startRemaining/Math.max(1,daysLeft-1));
  return {phase:phase,quota:Math.max(5,Math.min(60,q))};
}

function makeSet(name,lang,lines,builtin){
  return {id:uid(),name:name,lang:lang,builtin:!!builtin,cards:parseLines(lines.join('\n')).cards.map(function(c){return {id:uid(),fx:c.fx,de:c.de,box:1,due:0};})};
}
function defaultState(){
  return {name:'',goal:10,points:0,days:{},vdir:'mixed',sets:[makeSet('Englisch, Beispielwörter','en',EN_SAMPLE,true),makeSet('Französisch, Beispielwörter','fr',FR_SAMPLE,true)],math:{},exams:[]};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const s=JSON.parse(raw);return Object.assign(defaultState(),s);}
  }catch(e){}
  return defaultState();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

let state=load();
let view='home';
let ui={};

const dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const todayStart=function(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
const todayCount=function(){return (state.days[dkey()]||{c:0}).c;};
function bump(){const k=dkey();state.days[k]=state.days[k]||{c:0};state.days[k].c++;}
function addPts(n){state.points+=n;}
function streak(){
  let n=0;const d=new Date();
  if(todayCount()<state.goal)d.setDate(d.getDate()-1);
  while(((state.days[dkey(d)]||{c:0}).c)>=state.goal){n++;d.setDate(d.getDate()-1);}
  return n;
}
const levelInfo=function(){return {lvl:Math.floor(state.points/150)+1,into:state.points%150};};
const mstat=function(id){if(!state.math[id])state.math[id]={level:1,clean:0,fail:0};return state.math[id];};
const getSet=function(id){return state.sets.find(function(s){return s.id===id;});};
const getExam=id=>state.exams.find(e=>e.id===id);
const examDays=e=>daysUntil(e.date,new Date());
const examDoneToday=e=>(e.prog&&e.prog[dkey()])||0;
const examDoneTotal=e=>Object.keys(e.prog||{}).reduce((a,k)=>a+Math.min(15,e.prog[k]),0);
const subjLabel=sj=>sj==='math'?'Mathe':sj==='fr'?'Französisch':'Englisch';
function examCardsOf(e){const out=[];(e.sets||[]).forEach(sid=>{const st=getSet(sid);if(st)st.cards.forEach(c=>out.push({s:st,c:c}));});return out;}
function examTopics(e){return (e.topics||[]).filter(id=>TOPICS.some(t=>t.id===id));}
function examRemaining(e){
  if(e.subj==='math')return Math.max(0,examTopics(e).length*20-examDoneTotal(e));
  return examCardsOf(e).reduce((a,x)=>a+Math.max(0,4-x.c.box),0);
}
function addExamProg(id){const e=getExam(id);if(!e)return;e.prog=e.prog||{};const k=dkey();e.prog[k]=(e.prog[k]||0)+1;}
function examPlan(e){const d=examDays(e),done=examDoneToday(e);return {d:d,done:done,pl:quotaToday(examRemaining(e)+done,d)};}
function pickTopic(ids){
  const w=ids.map(id=>{const st=mstat(id);return 1+(3-st.level)+st.fail;});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<ids.length;i++){r-=w[i];if(r<=0)return ids[i];}
  return ids[ids.length-1];
}
const dueCount=function(set){const n=Date.now();return set.cards.filter(function(c){return c.due<=n;}).length;};
const langName=function(l){return l==='fr'?'Französisch':'Englisch';};

/* ---------- Bausteine ---------- */
function pips(n){return '<div class="pips" aria-label="Stufe '+n+' von 3">'+[1,2,3].map(function(i){return '<i class="'+(i<=n?'on':'')+'"></i>';}).join('')+'</div>';}
function boxesHtml(set){
  const cnt=[0,0,0,0,0];set.cards.forEach(function(c){cnt[Math.min(5,Math.max(1,c.box))-1]++;});
  const mx=Math.max.apply(null,cnt.concat([1]));
  const label=cnt.map(function(c,i){return 'Fach '+(i+1)+': '+c;}).join(', ');
  return '<div class="boxes" role="img" aria-label="'+label+'">'+cnt.map(function(c,i){
    return '<div class="bx"><b>'+c+'</b><div class="drawer"><i style="--h:'+(c?Math.max(14,Math.round(c/mx*100)):0)+'%"></i></div>Fach '+(i+1)+'</div>';
  }).join('')+'</div>';
}
function topBar(){
  return '<div class="top"><span class="brand">Lernheft</span><span class="pts"><b>'+state.points+'</b> Punkte</span></div>';
}
function keysRow(chars){
  if(!chars.length)return '';
  return '<div class="keys" aria-label="Sonderzeichen">'+chars.map(function(c){return '<button type="button" class="key" data-a="key" data-c="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div>';
}

  const m=ui.ms,it=m.item;

  const showKeys=it.kind==='lin'||(typeof it.ans==='number'&&it.ans<0)||it.pre==='x =';

      out+='<div class="fb info"><b>So geht es:</b> '+esc(it.sol)+(m.lvlmsg?'<br><br>'+esc(m.lvlmsg):'')+'</div>';
    }

    return out;
  }
  out+='<div class="stack" style="gap:10px"><div class="ansrow">'+(it.pre?'<span class="pre">'+esc(it.pre)+'</span>':'')+'<input id="ans" class="input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="'+(showKeys||it.kind==='lin'?'text':'decimal')+'" aria-label="Deine Antwort" value="'+esc(m.keep||'')+'">'+(it.unit?'<span class="unit">'+esc(it.unit)+'</span>':'')+'</div>'+

function examLine(id){
  const e=id&&getExam(id);if(!e)return '';
  const p=examPlan(e);
  return '<div class="fb info small">Für die Arbeit heute: '+Math.min(p.done,p.pl.quota)+' von '+p.pl.quota+' Aufgaben</div>';
}
function examBlock(){
  const list=state.exams.map(e=>({e:e,d:examDays(e)})).filter(x=>x.d>=0).sort((a,b)=>a.d-b.d);
  if(!list.length)return '<div class="card row between" style="gap:12px"><p class="muted small" style="flex:1;min-width:200px">Steht eine Arbeit an? Trage den Termin ein, dann plant die App die Tage bis dahin.</p><button class="btn ghost small" data-a="go" data-v="exams">Arbeit eintragen</button></div>';
  return list.map(x=>{
    const e=x.e,p=examPlan(e),pl=p.pl,unit=e.subj==='math'?'Aufgaben':'Karten';
    const when=p.d===0?'Heute':p.d===1?'Morgen':'In '+p.d+' Tagen';
    let info;
    if(pl.phase==='today')info='Heute ist die Arbeit. Schau höchstens kurz auf deine Fehler, dann Pause. Viel Erfolg!';
    else if(pl.phase==='repeat')info='Endspurt: Wiederhole jetzt vor allem, was noch wackelt.';
    else if(pl.quota===0)info='Der Stoff sitzt schon gut. Ein kurzer Durchgang hält ihn frisch.';
    else info='Aufbau: Schwache Sachen kommen zuerst dran.';
    const what=e.subj==='math'?examTopics(e).map(id=>TOPICS.find(t=>t.id===id).name).join(', '):(e.sets||[]).map(id=>{const st=getSet(id);return st?st.name:'';}).filter(Boolean).join(', ');
    let prog='';
    if(pl.quota>0){
      const dn=Math.min(p.done,pl.quota);
      prog='<div class="bar" role="progressbar" aria-valuenow="'+dn+'" aria-valuemin="0" aria-valuemax="'+pl.quota+'"><i style="width:'+(dn/pl.quota*100)+'%"></i></div><p class="small muted">'+(p.done>=pl.quota?'Tagesziel für die Arbeit geschafft.':'Heute '+dn+' von '+pl.quota+' '+unit+' richtig')+'</p>';
    }
    return '<div class="card exc'+(p.d<=2?' urgent':'')+' stack" style="gap:10px"><div class="row between"><h3>'+subjLabel(e.subj)+', '+dateLong(e.date)+'</h3><span class="badge">'+when+'</span></div><p class="small muted">'+esc(what)+'</p><p>'+info+'</p>'+prog+'<button class="btn block" data-a="examgo" data-e="'+e.id+'">'+(pl.phase==='today'?'Kurz wiederholen':'Für die Arbeit üben')+'</button></div>';
  }).join('');
}
function newEx(sj){
  return {subj:sj,date:'',sets:sj==='math'?[]:state.sets.filter(st=>st.lang===sj).map(st=>st.id),topics:sj==='math'?['rv','neg']:[],err:''};
}
function readEx(){
  const x=ui.ex;if(!x)return;
  const dt=$('exdate');if(dt)x.date=dt.value;
  x.sets=Array.prototype.map.call(document.querySelectorAll('.exset:checked'),i=>i.value);
  x.topics=Array.prototype.map.call(document.querySelectorAll('.extop:checked'),i=>i.value);
}
function examsView(){
  if(!ui.ex)ui.ex=newEx('math');
  const x=ui.ex;
  const all=state.exams.slice().sort((a,b)=>a.date<b.date?-1:1);
  let rows='';
  if(all.length){
    rows='<div><p class="eyebrow" style="margin-bottom:6px">Eingetragen</p>'+all.map(e=>{
      const d=examDays(e);
      const label=d<0?'vorbei':d===0?'heute':d===1?'morgen':'in '+d+' Tagen';
      return '<div class="exrow"><div><b>'+subjLabel(e.subj)+'</b><div class="small muted">'+dateLong(e.date)+', '+label+'</div></div>'+(ui.delEx===e.id?'<div class="row"><button class="btn danger small" data-a="exdelyes" data-e="'+e.id+'">Ja, entfernen</button><button class="btn ghost small" data-a="exdelno">Abbrechen</button></div>':'<button class="btn ghost danger small" data-a="exdel" data-e="'+e.id+'">Entfernen</button>')+'</div>';
    }).join('')+'</div>';
  }
  let stoff;
  if(x.subj==='math'){
    stoff='<div class="chks">'+TOPICS.map(t=>'<label class="chk"><input type="checkbox" class="extop" value="'+t.id+'"'+(x.topics.indexOf(t.id)>=0?' checked':'')+'>'+t.name+'</label>').join('')+'</div>';
  }else{
    const ls=state.sets.filter(st=>st.lang===x.subj);
    stoff=ls.length?'<div class="chks">'+ls.map(st=>'<label class="chk"><input type="checkbox" class="exset" value="'+st.id+'"'+(x.sets.indexOf(st.id)>=0?' checked':'')+'>'+esc(st.name)+' ('+st.cards.length+' Wörter)</label>').join('')+'</div>':'<div class="fb info">Lege zuerst unter Vokabeln eine Liste für dieses Fach an.</div>';
  }
  return topBar()+'<div class="stack"><div><button class="link" data-a="go" data-v="home">← Start</button><h1>Arbeiten</h1><p class="muted">Trage den Termin ein. Die App verteilt den Stoff auf die Tage bis dahin.</p></div>'+rows+
    '<div class="card stack"><h2>Neue Arbeit</h2>'+
    '<div><label class="lab" for="exsubj">Fach</label><select id="exsubj" class="select">'+[['math','Mathe'],['en','Englisch'],['fr','Französisch']].map(o=>'<option value="'+o[0]+'"'+(x.subj===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'+
    '<div><label class="lab" for="exdate">Datum der Arbeit</label><input id="exdate" class="input" type="date" min="'+dkey()+'" value="'+esc(x.date)+'"></div>'+
    '<div><p class="lab" style="margin-bottom:6px">Stoff</p>'+stoff+'</div>'+
    (x.err?'<p class="err">'+esc(x.err)+'</p>':'')+
    '<button class="btn block" data-a="exsave">Arbeit speichern</button></div></div>';
}

/* ---------- Render ---------- */
function render(){
  const inSession=view==='vsess'||view==='msess';
  let html='';
  if(view==='home')html=home();
  else if(view==='vocab')html=vocabList();
  else if(view==='vset')html=vocabSet();
  else if(view==='vedit')html=vocabEdit();
  else if(view==='vsess')html=vocabSession();
  else if(view==='vres')html=vocabResult();
  else if(view==='math')html=mathList();
  else if(view==='msess')html=mathSession();
  else if(view==='settings')html=settings();
  else if(view==='exams')html=examsView();
  root.innerHTML=html;
  navEl.hidden=inSession;
  const tab=(view==='home'||view==='settings'||view==='exams')?'home':(view==='math'||view==='msess')?'math':'vocab';
  navEl.innerHTML='<div class="in">'+[['home','Start'],['vocab','Vokabeln'],['math','Mathe']].map(function(x){return '<button data-a="go" data-v="'+x[0]+'"'+(tab===x[0]?' aria-current="page"':'')+'>'+x[1]+'</button>';}).join('')+'</div>';
  const inp=$('ans');
  if(inp&&ui.focus){inp.focus();const l=inp.value.length;try{inp.setSelectionRange(l,l);}catch(e){}}
  const nb=$('nextbtn');if(nb&&ui.focus)nb.focus();
  ui.focus=false;
}
function go(v){
  ui.confirmDel=false;ui.confirmReset=false;ui.delEx=null;if(v==='exams')ui.ex=null;
  view=v;window.scrollTo(0,0);render();
}

/* ---------- Vokabeln: Ablauf ---------- */
function startVocab(scope,force){
  let pool=[],examId=null,phase='';
  if(scope.indexOf('exam:')===0){
    const e=getExam(scope.slice(5));
    if(!e){go('exams');return;}
    examId=e.id;pool=examCardsOf(e);phase=examPlan(e).pl.phase;
  }else{
    const sets=scope==='all'?state.sets:state.sets.filter(function(s){return s.id===scope;});
    sets.forEach(function(s){s.cards.forEach(function(c){pool.push({s:s,c:c});});});
  }
  if(!pool.length){go(examId?'exams':'vocab');return;}
  const now=Date.now();
  let pick10;
  const due=pool.filter(function(x){return x.c.due<=now;});
  if(examId){
    let cand=pool;
    if(phase==='repeat'){const weak=pool.filter(function(x){return x.c.box<=3;});if(weak.length)cand=weak;}
    pick10=shuffle(cand).sort(function(a,b){return ((a.c.due<=now?0:1)-(b.c.due<=now?0:1))||(a.c.box-b.c.box);}).slice(0,10);
  }else if(due.length&&!force){
    pick10=shuffle(due).sort(function(a,b){return a.c.box-b.c.box;}).slice(0,10);
  }else{
    pick10=shuffle(pool).slice(0,10);
  }
  const queue=shuffle(pick10).map(function(x){
    const dir=state.vdir==='mixed'?(Math.random()<.5?'d2f':'f2d'):state.vdir;
    return {sid:x.s.id,cid:x.c.id,dir:dir,failed:false};
  });
  ui.vs={queue:queue,total:queue.length,correct:0,pts:0,missed:[],phase:'ask',retried:false,hinted:false,hint:'',keep:'',msg:'',fb:null,examId:examId};
  prepVocab();
  view='vsess';ui.focus=true;render();
}
function prepVocab(){
  const vs=ui.vs,q=vs.queue[0];if(!q)return;
  const set=getSet(q.sid),card=set.cards.find(function(c){return c.id===q.cid;});
  const toDe=q.dir==='f2d';
  vs.cur={prompt:toDe?card.fx:card.de,answer:toDe?card.de:card.fx,side:toDe?'de':set.lang,dirLabel:toDe?langName(set.lang)+' → Deutsch':'Deutsch → '+langName(set.lang),card:card};
  vs.retried=false;vs.hinted=false;vs.hint='';vs.keep='';vs.msg='';
}
function vFinish(ok,text){
  const vs=ui.vs,q=vs.queue[0],cur=vs.cur,card=cur.card;
  let gain=0;
  vs.queue.shift();
  let requeued=false;
  if(ok){
    gain=vs.hinted?5:vs.retried?6:10;
    if(!q.failed){
      vs.correct++;if(vs.examId)addExamProg(vs.examId);
      card.box=Math.min(5,card.box+1);
      card.due=todayStart()+INTERVAL[card.box]*DAY;
    }
    bump();
  }else{
    card.box=1;card.due=0;
    if(!q.failed){
      q.failed=true;requeued=true;
      vs.missed.push({fx:card.fx,de:card.de});
      vs.queue.splice(Math.min(3,vs.queue.length),0,q);
    }
  }
  vs.pts+=gain;addPts(gain);save();
  vs.fb={ok:ok,answer:cur.answer.replace(/\s*\/\s*/g,' / '),text:ok?(text||'Richtig!')+(gain?' +'+gain:''):'',requeued:requeued};
  vs.promptShown=cur.prompt;vs.dirLabel=cur.dirLabel;
  vs.phase='fb';ui.focus=true;render();
}
function vCheck(){
  const vs=ui.vs,cur=vs.cur,val=$('ans').value;
  const res=checkVocab(val,cur.answer,cur.side);
  if(res.r==='empty'){vs.msg='Schreibe erst etwas hin.';vs.keep='';ui.focus=true;render();return;}
  if(res.r==='almost'&&!vs.retried){vs.retried=true;vs.msg=res.msg+' Versuch es noch einmal.';vs.keep=val;ui.focus=true;render();return;}
  if(res.r==='ok'){vFinish(true,vs.retried?'Richtig, beim zweiten Versuch!':'Richtig!');return;}
  vFinish(false);
}
function vNext(){
  const vs=ui.vs;
  if(!vs.queue.length){view='vres';window.scrollTo(0,0);render();return;}
  vs.phase='ask';prepVocab();ui.focus=true;render();
}

/* ---------- Mathe: Ablauf ---------- */
function newItem(tid,prevQ){
  let id;
  if(tid==='mix')id=pick(TOPICS).id;
  else if(tid.indexOf('exam:')===0){const e=getExam(tid.slice(5));const ids=e?examTopics(e):[];id=ids.length?pickTopic(ids):pick(TOPICS).id;}
  else id=tid;
  const t=TOPICS.find(function(x){return x.id===id;});
  const lvl=mstat(id).level;
  let it,tries=0;
  do{it=t.gen(lvl);tries++;}while(prevQ&&it.q===prevQ&&tries<6);
  it.topicId=id;it.level=lvl;
  return it;
}
function startMath(tid){
  ui.ms={tid:tid,examId:(tid.indexOf('exam:')===0?tid.slice(5):null),solved:0,pts:0,item:newItem(tid),tips:0,attempts:0,phase:'ask',msg:'',keep:'',result:'',gain:0,lvlmsg:''};
  view='msess';window.scrollTo(0,0);ui.focus=true;render();
}
function mCheck(){
  const m=ui.ms,it=m.item,val=$('ans').value.trim();
  m.keep=val;
  if(!val){m.msg='Trage erst deine Antwort ein.';ui.focus=true;render();return;}
  const r=it.kind==='lin'?checkLin(val,it.ans):checkNum(val,it.ans);
  if(r==='format'){m.msg=it.kind==='lin'?'So schreibst du das Ergebnis: 4x + 2. Wenn keine Zahl übrig bleibt, nur 4x.':'Schreibe nur eine Zahl, zum Beispiel 12, '+MINUS+'3 oder 4,5.';ui.focus=true;render();return;}
  if(r==='notsimple'){m.msg='Fasse noch weiter zusammen. Am Ende steht nur ein Term mit x und eine Zahl da.';ui.focus=true;render();return;}
  m.attempts++;
  if(r==='ok'){
    const st=mstat(it.topicId);
    m.gain=Math.max(3,15-5*m.tips-(m.attempts>1?3:0));
    m.pts+=m.gain;m.solved++;addPts(m.gain);bump();if(m.examId)addExamProg(m.examId);
    const clean=m.tips===0&&m.attempts===1;
    st.fail=0;
    if(clean){st.clean++;if(st.clean>=3&&st.level<3){st.level++;st.clean=0;m.lvlmsg='Stark. Weiter geht es mit Stufe '+st.level+'.';}}
    else st.clean=0;
    m.phase='done';m.result='solved';save();ui.focus=true;render();return;
  }
  m.msg=m.attempts>=2?'Noch nicht richtig. Ein Tipp kann helfen.':'Noch nicht richtig. Rechne in Ruhe noch einmal nach.';
  ui.focus=true;render();
}
function mSol(){
  const m=ui.ms,st=mstat(m.item.topicId);
  st.clean=0;st.fail++;
  if(st.fail>=2&&st.level>1){st.level--;st.fail=0;m.lvlmsg='Wir üben auf Stufe '+st.level+' weiter. Das sitzt gleich.';}
  m.phase='done';m.result='solution';save();ui.focus=true;render();
}
function mNext(){
  const m=ui.ms;
  m.item=newItem(m.tid,m.item.q);m.tips=0;m.attempts=0;m.phase='ask';m.msg='';m.keep='';m.result='';m.lvlmsg='';
  ui.focus=true;render();
}

/* ---------- Ereignisse ---------- */
function insertAtCaret(ch){
  const inp=$('ans');if(!inp)return;
  const s=inp.selectionStart==null?inp.value.length:inp.selectionStart,e=inp.selectionEnd==null?s:inp.selectionEnd;
  inp.value=inp.value.slice(0,s)+ch+inp.value.slice(e);
  const p=s+ch.length;inp.focus();try{inp.setSelectionRange(p,p);}catch(x){}
}
function readEdit(){
  const e=ui.edit;
  e.name=($('ename')||{value:e.name}).value;
  e.lang=($('elang')||{value:e.lang}).value;
  e.text=($('etext')||{value:e.text}).value;
}
document.addEventListener('pointerdown',function(ev){
  if(ev.target.closest&&ev.target.closest('.key'))ev.preventDefault();
});
document.addEventListener('click',function(ev){
  const t=ev.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  switch(a){
    case 'go':go(t.dataset.v);break;
    case 'key':insertAtCaret(t.dataset.c);break;
    case 'savename':{const v=($('nm').value||'').trim();if(v)state.name=v;else state.nameSkipped=true;save();render();break;}
    case 'vset':ui.sid=t.dataset.s;go('vset');break;
    case 'vdir':state.vdir=t.dataset.d;save();render();break;
    case 'vstart':startVocab(t.dataset.s,!!t.dataset.f);break;
    case 'vnew':ui.edit={id:'',name:'',lang:'en',text:'',err:''};ui.confirmDel=false;view='vedit';window.scrollTo(0,0);render();break;
    case 'vedit':{const s=getSet(t.dataset.s);ui.edit={id:s.id,name:s.name,lang:s.lang,text:s.cards.map(function(c){return c.fx+' = '+c.de;}).join('\n'),err:''};ui.confirmDel=false;view='vedit';window.scrollTo(0,0);render();break;}
    case 'vedback':go(ui.edit&&ui.edit.id?'vset':'vocab');break;
    case 'vsave':{
      readEdit();const e=ui.edit;
      const name=e.name.trim(),p=parseLines(e.text);
      if(!name){e.err='Gib der Liste einen Namen.';render();break;}
      if(!p.cards.length){e.err='Schreibe mindestens ein Wort in der Form: Fremdwort = Deutsch';render();break;}
      if(e.id){
        const s=getSet(e.id),old={};
        s.cards.forEach(function(c){old[c.fx+'|'+c.de]=c;});
        s.name=name;s.lang=e.lang;
        s.cards=p.cards.map(function(c){const o=old[c.fx+'|'+c.de];return o||{id:uid(),fx:c.fx,de:c.de,box:1,due:0};});
        ui.sid=s.id;save();go('vset');
      }else{
        const s={id:uid(),name:name,lang:e.lang,builtin:false,cards:p.cards.map(function(c){return {id:uid(),fx:c.fx,de:c.de,box:1,due:0};})};
        state.sets.push(s);ui.sid=s.id;save();go('vset');
      }
      break;}
    case 'vdel':readEdit();ui.confirmDel=true;render();break;
    case 'vdelno':readEdit();ui.confirmDel=false;render();break;
    case 'vdelyes':state.sets=state.sets.filter(function(s){return s.id!==ui.edit.id;});save();go('vocab');break;
    case 'vcheck':vCheck();break;
    case 'vhint':{const vs=ui.vs;const alt=String(vs.cur.answer).split(/[\/;]/)[0].trim();vs.hint=alt.slice(0,1)+' …';vs.hinted=true;vs.keep=$('ans').value;ui.focus=true;render();break;}
    case 'vskip':vFinish(false);break;
    case 'vnext':vNext();break;
    case 'vend':go(ui.vs&&ui.vs.examId?'home':'vocab');break;
    case 'mstart':startMath(t.dataset.t);break;
    case 'mcheck':mCheck();break;
    case 'mtip':if(ui.ms.tips<2){ui.ms.keep=$('ans').value;ui.ms.tips++;ui.focus=true;render();}break;
    case 'msol':ui.ms.keep='';mSol();break;
    case 'mnext':mNext();break;
    case 'mend':go(ui.ms&&ui.ms.examId?'home':'math');break;
    case 'examgo':{
      const e=getExam(t.dataset.e);if(!e)break;
      if(e.subj==='math'){if(!examTopics(e).length){go('exams');break;}startMath('exam:'+e.id);}
      else startVocab('exam:'+e.id);
      break;}
    case 'exsave':{
      readEx();const x=ui.ex;
      if(!x.date){x.err='Wähle das Datum der Arbeit.';render();break;}
      if(daysUntil(x.date,new Date())<0){x.err='Das Datum liegt in der Vergangenheit.';render();break;}
      if(x.subj==='math'?!x.topics.length:!x.sets.length){x.err='Wähle mindestens '+(x.subj==='math'?'ein Thema':'eine Liste')+' aus.';render();break;}
      state.exams.push({id:uid(),subj:x.subj,date:x.date,sets:x.subj==='math'?[]:x.sets,topics:x.subj==='math'?x.topics:[],prog:{}});
      save();ui.ex=null;go('home');break;}
    case 'exdel':readEx();ui.delEx=t.dataset.e;render();break;
    case 'exdelno':readEx();ui.delEx=null;render();break;
    case 'exdelyes':state.exams=state.exams.filter(e=>e.id!==t.dataset.e);ui.delEx=null;save();render();break;
    case 'ssave':{const v=($('sname').value||'').trim();state.name=v;state.goal=parseInt($('sgoal').value,10)||10;save();go('home');break;}
    case 'reset':ui.confirmReset=true;render();break;
    case 'resetno':ui.confirmReset=false;render();break;
    case 'resetyes':state=defaultState();save();ui={};go('home');break;
  }
});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.id==='exsubj'&&ui.ex){
    const dt=$('exdate'),date=dt?dt.value:'';
    ui.ex=newEx(ev.target.value);ui.ex.date=date;render();
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  if(view==='vsess'){
    const vs=ui.vs;
    if(vs.phase==='ask'&&ev.target.id==='ans'){ev.preventDefault();vCheck();}
  }else if(view==='msess'){
    if(ui.ms.phase==='ask'&&ev.target.id==='ans'){ev.preventDefault();mCheck();}
  }else if(view==='home'&&ev.target.id==='nm'){
    ev.preventDefault();const v=(ev.target.value||'').trim();if(v)state.name=v;else state.nameSkipped=true;save();render();
  }
});
render();
})();
</script>
